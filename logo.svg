<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <!-- Letter centrelines, drawn huge so the inflated strokes press against the edges and each other. -->
    <path id="f" d="M66 444 V70 H212 M66 252 H176"/>
    <path id="s" d="M444 146 C438 100 410 82 372 82 C326 82 300 108 300 166 C300 226 338 246 372 254 C410 264 442 284 442 340 C442 402 410 430 370 430 C330 430 302 414 292 372"/>

    <!-- Platinum blue, lit from above. -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfe9f5"/>
      <stop offset=".4" stop-color="#a9c0dc"/>
      <stop offset=".75" stop-color="#7895bb"/>
      <stop offset="1" stop-color="#4d6c95"/>
    </linearGradient>

    <!-- Faint diagonal bands: the latex twisting along each stroke. Dark only, so it adds no shine. -->
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3253" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#1c3253" stop-opacity="0"/>
      <stop offset="1" stop-color="#1c3253" stop-opacity=".28"/>
    </linearGradient>
    <pattern id="twist" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(52)">
      <rect width="96" height="96" fill="url(#band)"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="puff" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- White outline: grow the shape's silhouette, paint it white, and lay the original on top. -->
    <filter id="outline" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="grown"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="grown" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>

    <!-- One inflated letter: shadow, seam outline, body, twist, and a soft lighter core so the
         middle of each tube bulges toward the viewer like a foil balloon. -->
    <g id="letterF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#f" xlink:href="#f" stroke="#3a2a00" stroke-opacity=".45" stroke-width="124" transform="translate(6 9)" filter="url(#shadow)"/>
      <use href="#f" xlink:href="#f" stroke="#22395a" stroke-width="124"/>
      <use href="#f" xlink:href="#f" stroke="url(#body)" stroke-width="112"/>
      <use href="#f" xlink:href="#f" stroke="url(#twist)" stroke-width="112"/>
      <use href="#f" xlink:href="#f" stroke="#eef4fb" stroke-opacity=".5" stroke-width="52" transform="translate(-8 -10)" filter="url(#puff)"/>
    </g>
    <g id="letterS" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#s" xlink:href="#s" stroke="#3a2a00" stroke-opacity=".45" stroke-width="124" transform="translate(6 9)" filter="url(#shadow)"/>
      <use href="#s" xlink:href="#s" stroke="#22395a" stroke-width="124"/>
      <use href="#s" xlink:href="#s" stroke="url(#body)" stroke-width="112"/>
      <use href="#s" xlink:href="#s" stroke="url(#twist)" stroke-width="112"/>
      <use href="#s" xlink:href="#s" stroke="#eef4fb" stroke-opacity=".5" stroke-width="52" transform="translate(-8 -10)" filter="url(#puff)"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#d4af37"/>

  <use href="#letterF" xlink:href="#letterF"/>
  <use href="#letterS" xlink:href="#letterS"/>

  <!-- Balloon highlights: a few crisp streaks where the light catches the upper-left of each
       bulging tube, plus small specular dots, rather than shine all over. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" filter="url(#soft)">
    <path d="M38 118 V196" stroke-width="13" stroke-opacity=".9"/>
    <path d="M100 44 H178" stroke-width="11" stroke-opacity=".8"/>
    <path d="M104 228 H150" stroke-width="9" stroke-opacity=".7"/>
    <path d="M320 140 C322 96 346 66 380 60" stroke-width="12" stroke-opacity=".85"/>
    <path d="M352 232 C380 238 404 246 418 258" stroke-width="8" stroke-opacity=".6"/>
    <path d="M418 318 C424 340 424 366 418 384" stroke-width="9" stroke-opacity=".7"/>
  </g>
  <g fill="#ffffff" filter="url(#soft)">
    <circle cx="38" cy="222" r="6"/>
    <circle cx="198" cy="44" r="5"/>
    <circle cx="410" cy="62" r="5"/>
    <circle cx="316" cy="410" r="5" opacity=".8"/>
  </g>

