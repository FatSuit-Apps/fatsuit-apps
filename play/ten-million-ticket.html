<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style><title>The $10 Million Ticket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lottery claim office ledger. Foil ticket opens the game, then a stat strip,
   life meters, and a three-column decision desk (menu | decision + effects preview | effects log). */
:root{
  --paper:#EFF2E9; --surface:#FAFBF6; --sunk:#E4E9DD; --ink:#14231B; --muted:#56665C; --line:#CDD5C6;
  --accent:#0C6A4A; --accent-ink:#FFFFFF; --foil:#B8890F; --foil-hi:#F1D67A; --foil-lo:#8A6508;
  --good:#22744A; --bad:#B03C27; --warn:#9B640E;
  --good-bg:#DDEEE2; --bad-bg:#F5E0DA; --warn-bg:#F3E8D2;
  --shadow:0 1px 0 rgba(20,35,27,.06),0 8px 24px -12px rgba(20,35,27,.25);
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-ui:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1712; --surface:#15211A; --sunk:#1C2A22; --ink:#E4ECE5; --muted:#93A398; --line:#2A3B31;
  --accent:#43B784; --accent-ink:#06150E; --foil:#D9B54A; --foil-hi:#F4DE8E; --foil-lo:#9C7716;
  --good:#5CC98C; --bad:#F0806A; --warn:#E3AE4F;
  --good-bg:#183526; --bad-bg:#3A1F19; --warn-bg:#36290F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1712; --surface:#15211A; --sunk:#1C2A22; --ink:#E4ECE5; --muted:#93A398; --line:#2A3B31;
  --accent:#43B784; --accent-ink:#06150E; --foil:#D9B54A; --foil-hi:#F4DE8E; --foil-lo:#9C7716;
  --good:#5CC98C; --bad:#F0806A; --warn:#E3AE4F;
  --good-bg:#183526; --bad-bg:#3A1F19; --warn-bg:#36290F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}
button{font-family:inherit}
.btn{font:600 14px/1 var(--f-ui);border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:11px 18px;border-radius:999px;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.foil{background:linear-gradient(135deg,var(--foil-lo),var(--foil) 40%,var(--foil-hi) 55%,var(--foil) 70%,var(--foil-lo));border-color:var(--foil-lo);color:#1E1604}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:7px 12px;font-size:13px}
:focus-visible{outline:3px solid var(--foil);outline-offset:2px}

/* ---------- Ticket screen ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:24px}
.ticket{position:relative;width:min(760px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) 150px}
.ticket::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(circle at 20% 120%,transparent 0 10px,var(--sunk) 10px 11px)}
.ticket .main{position:relative;padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ticket .stub{position:relative;border-left:2px dashed var(--line);padding:22px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,var(--sunk),transparent)}
.foilband{font-family:var(--f-display);font-size:clamp(22px,5vw,34px);line-height:1;letter-spacing:.02em;
  background:linear-gradient(100deg,var(--foil-lo),var(--foil) 30%,var(--foil-hi) 48%,var(--foil) 62%,var(--foil-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.balls{display:flex;flex-wrap:wrap;gap:10px}
.ball{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;
  background:var(--paper);border:2px solid var(--ink);color:var(--ink);transition:transform .35s,background .35s,color .35s}
.ball.gold{border-color:var(--foil-lo);background:var(--foil-hi);color:#1E1604}
.ball.hit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.ball.gold.hit{background:var(--foil);color:#1E1604}
.serial{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.08em}
.jackpot{font-family:var(--f-display);font-size:clamp(34px,9vw,72px);line-height:1;color:var(--ink)}
.jackpot.lit{background:linear-gradient(100deg,var(--foil-lo),var(--foil) 30%,var(--foil-hi) 50%,var(--foil) 66%,var(--foil-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s ease-in-out infinite;background-size:200% 100%}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
@media (max-width:560px){.ticket{grid-template-columns:minmax(0,1fr)}.ticket .stub{border-left:0;border-top:2px dashed var(--line);flex-direction:row;align-items:center}}
.intro{max-width:620px;text-align:center;display:flex;flex-direction:column;gap:10px}

/* ---------- Claim screen ---------- */
.claim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.claim{grid-template-columns:minmax(0,1fr)}}
.payout{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.payout[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.payout .big{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.1}
.factlist{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.factlist dt{color:var(--muted)} .factlist dd{margin:0;text-align:right;font-family:var(--f-num)}
.trustrow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.trustrow input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Header + stats ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand .logo{font-family:var(--f-display);font-size:20px;line-height:1}
.brand .logo span{color:var(--foil)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
.yearbar{display:flex;gap:4px;align-items:center}
.yearbar i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.yearbar i.done{background:var(--accent)} .yearbar i.now{background:var(--foil)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted)}
.stat.hero .v{color:var(--accent)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600}
.meter .row .num{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .5s}

/* ---------- Desk ---------- */
.desk{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1120px){.desk{grid-template-columns:230px minmax(0,1fr)}.feedcol{grid-column:1/-1}}
@media (max-width:760px){.desk{grid-template-columns:minmax(0,1fr)}}
.menu{display:flex;flex-direction:column;gap:14px}
.menu .grp{display:flex;flex-direction:column;gap:2px}
.menu .grp > .eyebrow{padding:0 10px 4px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.mi b{font-size:14px;font-weight:600}
.mi small{font-size:12px;color:var(--muted);line-height:1.3}
.mi:hover{background:var(--sunk)}
.mi[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
@media (max-width:760px){.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel .lede{color:var(--muted);max-width:62ch}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:700;font-size:14px;margin-bottom:8px;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--paper)}
.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
.opt b{display:block;font-size:14px;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.opt:has(input:checked){border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.opt.dis{opacity:.5;cursor:not-allowed}
.range{display:flex;flex-direction:column;gap:8px}
.range .lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700;font-size:14px;flex-wrap:wrap}
.range output{font-family:var(--f-num);font-size:22px;font-weight:600;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}
.commitrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- Effect card ---------- */
/* flex-shrink:0 keeps a card at full height inside the scrolling effects log instead of being squeezed */
.effect{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden;flex-shrink:0}
.effect .eh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.effect .eh h3{font-size:14px}
.egrid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:1px;background:var(--line)}
.egrid > div{background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.egrid .k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.egrid .v{font-family:var(--f-num);font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.egrid .v.zero{color:var(--muted);font-weight:400}
@media (max-width:560px){.egrid{grid-template-columns:repeat(2,minmax(0,1fr))}.egrid > div:first-child{grid-column:1/-1}}
.feedcol .egrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.feedcol .egrid > div:first-child{grid-column:1/-1}
.effect ul{margin:0;padding:10px 14px 12px 30px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.effect.blocked{border-color:var(--warn)}
.blockmsg{padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:14px}

.feedcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.feed{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto;padding-right:2px}
.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:13px}
.ledger .num{text-align:right}
.ledger .sum{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.chart svg{display:block;width:100%;height:auto}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:min(760px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.scrim.top{z-index:70}
.modal.confirm{width:min(560px,100%)}
.modal.confirm .egrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.modal.confirm .egrid > div:first-child{grid-column:1/-1}
.modal .mh{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.modal .mb{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.modal .mf{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:620px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.lifetable{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 14px;font-size:13.5px;align-items:baseline}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit}
.choice:hover{border-color:var(--accent)}
.choice b{font-weight:600}
.choice small{color:var(--muted)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.evtext{font-size:16px;max-width:62ch}
.stamp{font-family:var(--f-display);font-size:13px;color:var(--foil-lo);letter-spacing:.04em}

.cmp{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-snap-type:x mandatory}
.cmp td,.cmp thead th:not(:first-child){width:var(--colw,auto);min-width:var(--colw,0);max-width:var(--colw,none);scroll-snap-align:start}
.cmp table{border-collapse:collapse;font-size:13px;min-width:100%}
.cmp th,.cmp td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.cmp tr:last-child > *{border-bottom:0}
.cmp thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cmp th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:600;box-shadow:1px 0 0 var(--line)}
.cmp td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.cmp td.ev{white-space:normal;overflow-wrap:anywhere;text-align:left;font-size:12px;line-height:1.4;color:var(--muted)}
.cmp .cur{background:var(--sunk)}
.cmp thead th.cur{color:var(--ink)}
@media (max-width:560px){.cmp table{font-size:12px}.cmp th,.cmp td{padding:6px 7px}.cmp th:first-child{white-space:normal;min-width:92px;max-width:98px}.cmp td.ev{font-size:11.5px}}
.cmp-hint{margin-bottom:-2px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- End ---------- */
.verdict{font-family:var(--f-display);font-size:clamp(28px,6vw,52px);line-height:1.05}
.spend{display:flex;flex-direction:column;gap:8px}
.spend .r{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13.5px}
.spend .r .b{height:10px;border-radius:5px;background:var(--accent)}
@media (max-width:520px){.spend .r{grid-template-columns:110px minmax(0,1fr) 76px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow)}   /* below pop-ups (50+) */
.fineprint{font-size:12px;color:var(--muted);max-width:80ch}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============ Constants ============ */
const FED = .37, WITH = .24, ST = .05;               // effective federal on a jackpot, federal withholding, state
const LUMP_CASH = 6e6;                                 // cash value of a $10M advertised jackpot
const ANN_MONTHS = 360, ANN_GROSS_M = 1e7 / 360;
const ANN_NET_M = ANN_GROSS_M * (1 - WITH - ST);       // what lands each month
const ANN_APRIL = ANN_GROSS_M * 12 * (FED - WITH);     // extra tax owed each April
const LUMP_NOW = LUMP_CASH * (1 - WITH - ST), LUMP_APRIL = LUMP_CASH * (FED - WITH);
const TRUST_FEE = 30000, RENT = 21600, SALARY = 62000, MAX_YEAR = 10;

const ASSETS = {
  savings:{name:'High-yield savings', mean:.04, sd:.004, crash:.04, risk:'Very low', blurb:'Insured and boring. Barely beats inflation.'},
  bonds:{name:'Bond fund', mean:.045, sd:.05, crash:-.04, risk:'Low', blurb:'Steady income, small swings.'},
  index:{name:'Index funds', mean:.08, sd:.16, crash:-.32, reb:.22, risk:'Medium', blurb:'The whole stock market. Drops hard sometimes, recovers over time.'},
  stocks:{name:'Hand-picked stocks', mean:.08, sd:.32, crash:-.45, reb:.30, risk:'High', blurb:'A few companies you believe in. Big swings both ways.'},
  crypto:{name:'Crypto', mean:.10, sd:.70, crash:-.65, reb:.55, risk:'Extreme', blurb:'Can double or lose most of its value in a year.'},
  rental:{name:'Rental properties', mean:.07, sd:.09, crash:-.12, reb:.05, risk:'Medium', blurb:'Rent plus appreciation. Tenants, repairs, and vacancies included.'},
  angel:{name:"Friends' startups", mean:.09, sd:1, crash:-.3, risk:'Extreme', blurb:'Most fail, a rare one returns many times over. Money is locked up.'}
};
const BIZ = {
  truck:{name:'Food truck', cost:180000, profit:.20, sd:.15, fail:.14, blurb:'Low cost, long hours. Profit depends on you showing up.'},
  brand:{name:'Online clothing brand', cost:350000, profit:.06, sd:.25, fail:.16, blurb:'Ads are expensive; one viral product can change everything.'},
  restaurant:{name:'Neighborhood restaurant', cost:850000, profit:.07, sd:.18, fail:.20, blurb:'Many new restaurants close within three years.'},
  franchise:{name:'Fitness franchise', cost:1400000, profit:.11, sd:.07, fail:.06, blurb:'Proven playbook with steady, capped returns. Royalties take 6–8% of sales.'},
  startup:{name:'Tech startup', cost:2000000, profit:0, sd:0, fail:.25, burn:500000, blurb:'Burns about $500k a year. Most fail; a few return 10x.'}
};
const PUB_LABEL = ['Nobody', 'Closest family', 'Friends & family', 'Everyone'];
const PUB_H = [0, 6, 9, 12], PUB_R = [0, 6, 3, -6], PUB_S = [0, -4, -16, -32];
// [who, is family] — the money-request event words its outcomes to match.
const NAMES = [['your cousin Jordan', true], ['your brother-in-law Sam', true], ['your aunt Robin', true], ['your old roommate Casey', false], ['your coworker Alex', false], ['your college friend Morgan', false]];

/* ============ Helpers ============ */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function gauss(){ let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function money(n, o = {}){
  const sg = n < 0 ? '−' : (o.sign && n > 0 ? '+' : ''); const a = Math.abs(n); let t;
  if (a >= 1e6 && o.full !== true) t = '$' + (a / 1e6).toFixed(a >= 1e8 ? 0 : 2).replace(/\.?0+$/, '') + 'M';
  else if (o.k && a >= 1e4) t = '$' + Math.round(a / 1e3) + 'k';
  else t = '$' + Math.round(a).toLocaleString('en-US');
  return sg + t;
}
const pct = r => (r >= 0 ? '+' : '−') + Math.abs(r * 100).toFixed(1) + '%';
function nice(x){ if (x < 1e4) return Math.round(x / 500) * 500; if (x < 1e5) return Math.round(x / 1e3) * 1e3; if (x < 1e6) return Math.round(x / 5e3) * 5e3; return Math.round(x / 25e3) * 25e3; }
function eff(o){ return Object.assign({cash:0, flow:0, growth:0, happy:0, rel:0, safety:0, health:0, notes:[], blocked:null, apply:null}, o); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));

/* ============ State ============ */
let S, UI;
function newState(){
  return {
    screen:'ticket', year:1, age:34, payout:null, trust:false,
    cash:12000, debt:45000, debtRate:.14, job:'full', salary:SALARY,

    publicity:0, generous:0, loans:[], parentsHome:false,
    sec:{unlisted:false, system:false, detail:false, umbrella:false},
    svc:{advisor:null, cpa:false, therapy:false, trainer:false, jet:false, school:0},
    lux:{yacht:0, art:0, jewelry:0},
    m:{happy:52, rel:60, safety:78, health:58},
    annLeft:0, charityYear:0, rebound:false, spent:{}, feed:[], history:[], over:null, decisions:0,
    partner:true, tension:0, seen:{}, childSupport:0, parentAllowance:0, reports:[]
  };
}
function newUI(){ return {active:'budget', vals:{}, modal:null, confirm:null, sel:{payout:'lump', trust:true, partner:true}, revealed:false}; }

/* ============ Derived values ============ */
const invested = () => Object.values(S.inv).reduce((a, b) => a + b, 0);
const liquid = () => S.cash + invested() - S.inv.angel;
const homeEquity = () => S.house ? S.house.value - S.house.loan : 0;
const carsValue = () => S.cars.reduce((a, c) => a + c.value, 0);
const luxValue = () => S.lux.yacht + S.lux.art + S.lux.jewelry;
const bizValue = () => S.business && S.business.open ? S.business.value : 0;
const things = () => homeEquity() + carsValue() + luxValue() + bizValue();
const netWorth = () => S.cash + invested() + things() - S.debt;
const salaryNet = () => S.job === 'full' ? S.salary * .6 : S.job === 'part' ? S.salary * .3 : 0;
const annNetYear = () => S.payout === 'annuity' && S.annLeft > 0 ? ANN_NET_M * 12 - ANN_APRIL : 0;
const annLeftNet = () => S.payout === 'annuity' ? S.annLeft * ANN_NET_M * (1 - (FED - WITH) / (1 - WITH - ST)) : 0;
function annPV(){ if (S.payout !== 'annuity') return 0; const yrs = Math.ceil(S.annLeft / 12); let pv = 0; for (let i = 1; i <= yrs; i++) pv += (ANN_NET_M * 12 - ANN_APRIL) / Math.pow(1.04, i); return pv; }
const effPub = () => Math.min(3, S.publicity + (S.trust ? 0 : 1));
const purposeful = () => S.job !== 'quit' || (S.business && S.business.open) || S.svc.school > 0 || S.charityYear > 0;
function grossIncome(){ let g = S.job === 'full' ? S.salary : S.job === 'part' ? S.salary / 2 : 0; if (S.payout === 'lump' && S.year === 1) g += LUMP_CASH; if (S.payout === 'annuity') g += ANN_GROSS_M * 12; return g; }
function advisorFee(){ if (!S.svc.advisor) return 0; const r = S.svc.advisor === 'fiduciary' ? .0075 : .02; return Math.max(S.svc.advisor === 'fiduciary' ? 5000 : 0, invested() * r); }
function costLines(){
  const L = [];
  L.push(['Living expenses' + (S.budget.mode === 'none' ? ' (no budget)' : ''), 12 * S.budget.monthly]);
  if (!S.house) L.push(['Rent', RENT]);
  else { L.push(['Home tax, insurance & upkeep', S.house.carry]); if (S.house.loan > 0) L.push(['Mortgage payments', S.house.payment]); }
  const cc = S.cars.reduce((a, c) => a + c.carry, 0); if (cc) L.push(['Car insurance & upkeep', cc]);
  if (S.debt > 0) L.push(['Debt interest', S.debt * S.debtRate]);
  if (S.sec.system) L.push(['Security monitoring', 4000]);
  if (S.sec.detail) L.push(['Private security detail', 280000]);
  if (S.sec.umbrella) L.push(['Umbrella insurance', 3500]);
  const af = advisorFee(); if (af) L.push([S.svc.advisor === 'fiduciary' ? 'Fiduciary advisor fee' : 'Broker fees & commissions', af]);
  if (S.svc.cpa) L.push(['Tax & estate team', 8000]);
  if (S.svc.therapy) L.push(['Therapist', 9000]);
  if (S.svc.trainer) L.push(['Trainer & private chef', 90000]);
  if (S.svc.jet) L.push(['Private jet card', 250000]);
  if (S.svc.school > 0) L.push(['Tuition', 60000]);
  if (S.lux.yacht > 0) L.push(['Yacht crew, dock & fuel', 450000]);
  if (S.parentsHome) L.push(["Upkeep on your parents' home", 12000]);
  if (S.parentAllowance) L.push(['Allowance for your parents', S.parentAllowance]);
  if (S.childSupport) L.push(['Child support', S.childSupport]);
  return L.filter(x => x[1] > 0);
}
const yearlyCosts = () => costLines().reduce((a, x) => a + x[1], 0);
const yearlyIncome = () => salaryNet() + annNetYear();
function safetyTarget(){
  let t = [84, 76, 58, 34][S.publicity] - (S.trust ? 0 : 8);
  if (S.sec.unlisted) t += 6; if (S.sec.system) t += 8; if (S.sec.detail) t += 22;
  if (S.house && S.house.price > 1.5e6) t += 5; if (S.lux.yacht) t -= 3;
  S.cars.forEach(c => { if (c.tier === 3) t -= 2; if (c.tier === 4) t -= 5; });
  if (S.lux.jewelry > 2e5) t -= 3;
  return clamp(t, 5, 97);
}
function addSpend(cat, amt){ if (amt > 0) S.spent[cat] = (S.spent[cat] || 0) + amt; }
function pubDelta(t){ if (t <= S.publicity) return {happy:0, rel:0, safety:0}; return {happy:PUB_H[t] - PUB_H[S.publicity], rel:PUB_R[t] - PUB_R[S.publicity], safety:PUB_S[t] - PUB_S[S.publicity]}; }
function mortgagePayment(loan){ const r = .065 / 12, n = 360; return 12 * loan * r / (1 - Math.pow(1 + r, -n)); }
function runwayNote(extraCost){
  const inc = yearlyIncome() + liquid() * .04; const cost = yearlyCosts() + (extraCost || 0); const gap = cost - inc;
  if (gap <= 0) return {ok:true, text:`Sustainable: your income plus a safe 4% draw on savings (${money(inc)}/yr) covers ${money(cost)}/yr in costs.`};
  const yrs = liquid() / Math.max(1, cost - yearlyIncome());
  return {ok:false, text:`Not sustainable: costs of ${money(cost)}/yr exceed safe income of ${money(inc)}/yr. At this pace your cash and investments last about ${yrs < 1 ? 'under a year' : Math.round(yrs) + ' years'}.`};
}

D.budget = {cat:'Living', title:'Monthly budget', lede:'Decide what everyday life costs: groceries, dining out, clothes, subscriptions, fun. This is the decision that most quietly decides how long the money lasts.',
  status:() => S.budget.mode === 'none' ? 'No budget · ' + money(S.budget.monthly) + '/mo and rising' : money(S.budget.monthly) + '/mo',

    {key:'monthly', type:'range', label:'Monthly spending', min:2000, max:250000, log:true, def:Math.max(6000, S.budget.monthly), hide:v => v.mode === 'none'}],
  effect(v){
    if (v.mode === 'none'){
      if (S.budget.mode === 'none') return eff({blocked:'You are already spending without a budget.'});

      return eff({flow:-d, happy:4, health:-3, notes:['Freedom feels great at first. Spending starts around ' + money(m) + '/mo.', 'Without a limit, lifestyle creep pushes spending up about 30% a year, plus impulse buys.', runwayNote(d).text],
        apply:S => { S.budget = {mode:'none', monthly:m}; }});
    }
    const m = v.monthly, d = 12 * (m - S.budget.monthly);
    if (S.budget.mode === 'set' && Math.abs(m - S.budget.monthly) < 1) return eff({blocked:'That is already your budget.'});
    const h = clamp(Math.round(4 * Math.log2(m / Math.max(2000, S.budget.monthly))), -10, 12);
    const rw = runwayNote(d);

    if (m <= 8000) notes.push('A modest budget keeps your old life intact. Most of the jackpot gets to keep working for you.');
    if (m >= 40000) notes.push('At this level, staff, dining, and shopping become the normal you adapt to. Cutting back later feels like a loss.');
    return eff({flow:-d, happy:h, health:(S.budget.mode === 'none' ? 5 : 0) + (rw.ok ? 2 : -3), notes, apply:S => { S.budget = {mode:'set', monthly:m}; }});

D.invest = {cat:'Investing', title:'Invest or withdraw', lede:'Put cash to work, or pull money out. Returns each year are random, based on long-run averages. Crashes happen.',

      {key:'amt', type:'range', label:dir === 'in' ? 'Amount to invest' : 'Amount to withdraw', min:0, max, log:false, def:Math.min(max, nice(max * .25)), quick:true}];

        apply:S => { S.inv[v.asset] -= amt; }});

    const risky = ['stocks', 'crypto', 'angel'].includes(v.asset);

    const notes = [a.blurb, `Expected growth about ${money(amt * a.mean)} a year on average.`, `In a crash year this could fall about ${Math.abs(a.crash * 100).toFixed(0)}% (${money(amt * a.crash)}).`];

D.house = {cat:'Home', title:'Buy a home', lede:'You rent a one-bedroom for $1,800 a month. Owning means equity, but also taxes, insurance, and repairs forever.',
  status:() => S.house ? 'Own a ' + money(S.house.price) + ' home' : 'Renting',
  controls:() => S.house ? [{key:'act', type:'choice', label:'Your home', def:'sell', options:[{v:'sell', label:'Sell it and rent again', sub:'About 6% in agent and closing fees'}]}]
    : [{key:'price', type:'range', label:'Home price', min:250000, max:15000000, log:true, def:750000},
       {key:'fin', type:'choice', label:'How will you pay?', def:'cash', options:[{v:'cash', label:'Pay cash', sub:'No mortgage, more cash tied up'}, {v:'mortgage', label:'Mortgage', sub:'20% down, 30 years at 6.5%'}]}],

    if (S.house){
      const h = S.house, net = h.value * .94 - h.loan;
      return eff({cash:net, flow:h.carry + (h.loan > 0 ? h.payment : 0) - RENT, happy:-6, rel:-1, safety:-3, notes:[`You walk away with ${money(net)} after fees${h.loan > 0 ? ' and paying off the mortgage' : ''}.`, 'You go back to paying $1,800/mo rent.', 'Moving is one of life’s more stressful events.'], apply:S => { S.house = null; }});

/* ============ Claim ============ */
function claimEffect(p, trust){
  const t = trust ? {cash:-TRUST_FEE, safety:8} : {cash:0, safety:0};
  const tn = trust ? ['Lawyers claim through an anonymous trust ($30,000). Your name stays off the lottery website.'] : ['Your name and city appear on the lottery’s winners page. Scammers read those pages.'];
  if (p === 'lump') return eff({cash:LUMP_NOW + t.cash, happy:18, safety:-6 + t.safety, health:-2, notes:[
    `The $10M jackpot has a cash value of ${money(LUMP_CASH)}. After 24% federal and 5% state withholding, ${money(LUMP_NOW, {full:true})} lands in your account.`,
    `Warning: withholding isn’t the whole tax. You’ll owe about ${money(LUMP_APRIL, {full:true})} more next April.`,
    'Invested carefully, the money could pay you about $140,000 a year forever. Spent carelessly, it can be gone in a few years.'].concat(tn)});
  return eff({cash:ANN_NET_M * 12 + t.cash, flow:ANN_NET_M * 12 - ANN_APRIL, happy:12, safety:-2 + t.safety, health:3, notes:[
    `${money(ANN_NET_M, {full:true})} arrives every month for 30 years (360 payments) after withholding, about ${money(ANN_NET_M * 12 - ANN_APRIL, {full:true})} a year after your April tax bill.`,
    'A built-in guardrail: even a terrible year of spending can’t touch next year’s payments.',
    'Inflation shrinks it: at 3% a year, your last check buys about 41% of what the first one does.'].concat(tn)});
}
function doClaim(){
  const p = UI.sel.payout, tr = UI.sel.trust, E = claimEffect(p, tr);
  S.payout = p; S.trust = tr; S.partner = UI.sel.partner;
  if (p === 'annuity') S.annLeft = ANN_MONTHS - 12;
  applyEffect(E, 'Claim: ' + (p === 'lump' ? 'lump sum' : 'monthly payments'), 'Taxes');
  if (tr) addSpend('Protection & help', TRUST_FEE);
  S.history = [{year:0, nw:netWorth()}];
  S.screen = 'play'; render(); window.scrollTo(0, 0);
}

/* ============ Applying effects ============ */
function applyEffect(E, title, cat){
  S.cash += E.cash;
  for (const k of ['happy', 'rel', 'safety', 'health']) S.m[k] = clamp(S.m[k] + E[k], 0, 100);
  if (E.apply) E.apply(S);
  S.feed.unshift({title, year:S.year, E:strip(E)});
  if (S.feed.length > 40) S.feed.pop();
}
const strip = E => ({cash:E.cash, flow:E.flow, growth:E.growth, happy:E.happy, rel:E.rel, safety:E.safety, health:E.health, notes:E.notes});

/* ============ Year end ============ */
function endYear(){
  if (S.pending) return;   // this year's report is still open; never finish a year twice
  const R = {year:S.year, startNW:netWorth(), income:[], costs:[], invest:[], assets:[], life:[], notes:[]};
  const sal = salaryNet(); if (sal){ S.cash += sal; R.income.push(['Salary after tax', sal]); }
  if (S.payout === 'annuity') R.notes.push({t:'info', s:`This year’s 12 annuity payments (${money(ANN_NET_M * 12)}) arrived at the start of the year, so they were already in your cash.`});
  for (const [l, a] of costLines()){ S.cash -= a; R.costs.push([l, a]); }
  addSpend('Living', 12 * S.budget.monthly + (S.house ? 0 : RENT));
  let tax = 0; if (S.payout === 'lump' && S.year === 1) tax = LUMP_APRIL; if (S.payout === 'annuity') tax = ANN_APRIL;
  const ded = Math.min(S.charityYear, .6 * grossIncome()) * FED;
  if (tax){ tax = Math.max(0, tax - ded); if (S.svc.cpa) tax *= .97; S.cash -= tax; R.costs.push([S.payout === 'lump' ? 'April tax bill on the jackpot' : 'April tax bill on the annuity' + (ded ? ' (after charity deduction)' : ''), tax]); addSpend('Taxes', tax); }

  // markets
  const crash = Math.random() < (S.year === 1 ? .07 : .13), z = gauss(), reb = S.rebound; S.rebound = false;
  R.crash = crash; let crashLoss = 0;
  for (const [k, a] of Object.entries(ASSETS)){
    const h = S.inv[k]; if (h < 1) continue; let r;
    if (k === 'angel'){ const u = Math.random(); r = u < .15 ? -.85 : u < .93 ? -.04 : 4; }
    else if (crash) r = a.crash + gauss() * .05;
    else r = a.mean + (reb && a.reb ? a.reb : 0) + a.sd * (.7 * z + .71 * gauss());
    r = Math.max(-.95, r); const g = h * r; S.inv[k] += g;
    if (crash && ['index', 'stocks', 'crypto'].includes(k)) crashLoss += g;
    R.invest.push([a.name + (k === 'angel' && r > 1 ? ' (one got acquired!)' : k === 'angel' && r < -.5 ? ' (a startup folded)' : ''), r, g]);
  }
  R.crashLoss = crashLoss;
  // property & things
  if (S.house){ const r = .03 + .06 * gauss() - (crash ? .08 : 0), g = S.house.value * r; S.house.value += g; R.assets.push(['Home value', g]);
    if (S.house.loan > 0){ const int = S.house.loan * .065; S.house.loan = Math.max(0, S.house.loan - (S.house.payment - int)); } }
  let cd = 0; S.cars.forEach(c => { const d = c.value * (c.tier === 0 ? .1 : .15); c.value -= d; cd += d; }); if (cd) R.assets.push(['Car depreciation', -cd]);
  if (S.lux.yacht){ const d = S.lux.yacht * .08; S.lux.yacht -= d; R.assets.push(['Yacht depreciation', -d]); }
  if (S.lux.art){ const g = S.lux.art * Math.max(-.6, .03 + .25 * gauss()); S.lux.art += g; R.assets.push(['Art collection', g]); }
  if (S.lux.jewelry){ const d = S.lux.jewelry * .03; S.lux.jewelry -= d; }
  // business
  if (S.business && S.business.open){
    const b = S.business, T = BIZ[b.type]; b.years++;
    let fail = T.fail * (S.job === 'full' ? 1.6 : 1) * (b.boost ? .6 : 1) * (b.years > 3 && b.type === 'restaurant' ? .4 : 1); b.boost = false;
    if (b.type === 'startup'){
      const u = Math.random();
      if (u < fail){ b.open = false; R.biz = `Your tech startup ran out of runway and shut down. The ${money(b.value)} you put in is gone.`; b.value = 0; }
      else if (u < fail + .08 && b.years >= 2){ const pay = b.value * 10; S.cash += pay; b.open = false; R.biz = `A larger company acquired your startup for ${money(pay)}! You beat long odds.`; R.income.push(['Startup acquisition', pay]); }
      else { if (S.cash >= T.burn){ S.cash -= T.burn; b.value += T.burn * .8; R.costs.push(['Startup burn (salaries, servers)', T.burn]); addSpend('Business', T.burn); R.biz = 'Your startup is still alive. It burned $500,000 and is chasing its next milestone.'; }
        else { b.open = false; R.biz = 'You couldn’t fund another year of burn. The startup closes.'; b.value = 0; } }
    } else if (Math.random() < fail){ R.biz = `Your ${T.name.toLowerCase()} closed this year. ${pick(['A rent hike', 'A new competitor', 'A bad review cycle', 'Rising supply costs'])} was too much. The ${money(b.value)} invested is gone.`; b.open = false; b.value = 0; }
    else { const p = b.value * (T.profit - (S.job === 'full' ? .04 : 0) + T.sd * gauss()); S.cash += p; b.value *= 1.03;
      R.income.push([T.name + (p >= 0 ? ' profit' : ' loss'), p]); R.biz = p >= 0 ? `Your ${T.name.toLowerCase()} made ${money(p)} this year.` : `Your ${T.name.toLowerCase()} lost ${money(-p)} this year. Not every year is good.`; }
  }
  // shortfall
  if (S.cash < 0){
    const sold = []; for (const k of ['savings', 'bonds', 'index', 'stocks', 'crypto', 'rental']){ if (S.cash >= 0) break; const take = Math.min(S.inv[k], -S.cash / (k === 'rental' ? .93 : 1)); if (take > 0){ S.inv[k] -= take; S.cash += take * (k === 'rental' ? .93 : 1); sold.push(ASSETS[k].name); } }
    if (sold.length) R.notes.push({t:'bad', s:`You spent more than you had in cash, so investments were sold to cover it: ${sold.join(', ')}.`});
    if (S.cash < 0){ S.debt += -S.cash; S.debtRate = Math.max(S.debtRate, .22); R.notes.push({t:'bad', s:`Still short. ${money(-S.cash)} went onto credit cards and personal loans at 22% interest.`}); S.cash = 0; R.short = true; }
  }
  // life meters
  const before = {...S.m};
  let base = 50 + (S.debt > 0 ? -6 : 5) + (S.m.rel - 50) * .25 + (S.m.health - 50) * .2 + (S.house ? 3 : 0) - (S.publicity === 3 ? 3 : 0) - (R.short ? 12 : 0);
  const idle = !purposeful(); if (idle) base -= 10; else if (S.job !== 'full') base += 4;
  S.m.happy = clamp(S.m.happy + (base - S.m.happy) * .45, 0, 100);
  S.m.safety = clamp(S.m.safety + (safetyTarget() - S.m.safety) * .5, 0, 100);
  let ht = 60 - S.year * .5 + (S.svc.trainer ? 15 : 0) + (S.svc.therapy ? 6 : 0) - (S.job === 'full' ? 4 : 0) - (S.business && S.business.open ? (S.job === 'full' ? 10 : 4) : 0) - (R.short ? 8 : 0) - (S.inv.rental > 0 ? 2 : 0) + (S.debt === 0 ? 3 : 0);
  S.m.health = clamp(S.m.health + (ht - S.m.health) * .3, 0, 100);
  const rt = 60 - S.publicity * 4 + Math.min(10, S.generous * 2) - (S.sec.detail ? 3 : 0) + (S.svc.therapy ? 3 : 0);
  S.m.rel = clamp(S.m.rel + (rt - S.m.rel) * .25, 0, 100);
  R.life = [
    ['Happiness', before.happy, S.m.happy, idle ? 'Without work or a project, the days blur together.' : S.m.happy < before.happy ? 'The thrill of new things fades back toward your everyday baseline.' : 'Your day-to-day life feels good.'],
    ['Relationships', before.rel, S.m.rel, S.publicity >= 2 ? 'Knowing you’re rich changes how people treat you.' : 'Relationships settle back toward normal.'],
    ['Safety', before.safety, S.m.safety, S.publicity >= 2 ? 'The more people know, the bigger the target.' : S.trust ? 'Few people know, so you stay under the radar.' : 'Your name on the lottery site draws some attention.'],
    ['Health', before.health, S.m.health, S.svc.trainer ? 'Your trainer and chef keep you in good shape.' : R.short ? 'Money stress is wearing on you.' : S.business && S.business.open ? 'Running a business is stressful.' : 'Small, gradual changes.']];
  // bankruptcy
  if (S.debt > 0 && netWorth() < -25000) S.over = 'bankrupt';
  S.history.push({year:S.year, nw:netWorth()}); R.endNW = netWorth();
  // A compact copy of this report, kept so later reports can compare years side by side.
  R.sum = {year:S.year, startNW:R.startNW, moneyIn:R.income.reduce((a, x) => a + x[1], 0), moneyOut:R.costs.reduce((a, x) => a + x[1], 0),
    growth:R.invest.reduce((a, x) => a + x[2], 0) + R.assets.reduce((a, x) => a + x[1], 0), crash, events:[]};
  snapYear(R.sum); S.reports.push(R.sum);
  // events
  // Each event happens at most once per game (S.seen). Loans coming due is the exception: it settles loans you made.
  // Later market crashes still hit your portfolio and show in the report; only the sell-or-hold card is one-time.
  const Q = []; if (crash && crashLoss < -5000 && !S.seen.crash){ Q.push(EV.crash); S.seen.crash = true; }
  const pool = Object.entries(EV).filter(([id]) => id !== 'crash').sort(() => Math.random() - .5);
  for (const [id, e] of pool){ if (Q.length >= 3) break; if (id === 'loanback' || S.seen[id]) continue; const p = e.p(); if (p > 0 && Math.random() < p){ Q.push(e); S.seen[id] = true; } }
  if (S.loans.length && !Q.includes(EV.loanback)) Q.push(EV.loanback);
  // The open report lives in S.pending so closing the app mid-report keeps it, events and all.
  // Each event gets a seed so rebuilding it after a reload gives the same people and amounts.
  const ids = Q.map(e => Object.keys(EV).find(k => EV[k] === e)), seeds = ids.map(() => Math.floor(Math.random() * 2 ** 31));
  S.loansDue = S.loans.length;   // loans made before this report; loans from its events come due next year
  S.charityYear = 0;
  // Events are built from this snapshot, now and after any reload, so later events in the report
  // keep the amounts and names they had when the report opened.
  const {feed, history, reports, pending, ...snap} = JSON.parse(JSON.stringify(S));
  R.events = ids.map((id, i) => buildEvent(id, seeds[i], snap));
  const {events, sum, ...data} = R;
  S.pending = {R:data, ids, seeds, snap, step:-1, outcome:null};
  UI.modal = {kind:'report', R, step:-1, outcome:null};
  render();
}
const lastReport = () => S.reports[S.reports.length - 1];
function snapYear(sum){ Object.assign(sum, {endNW:netWorth(), cash:S.cash, invested:invested(), debt:S.debt, m:{...S.m}}); }
// A small seeded random generator (mulberry32), swapped in while an event is built.
function seeded(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Builds an event against the report-opening snapshot. Choices still act on the live game when picked.
function buildEvent(id, seed, snap){
  const real = Math.random, live = S; Math.random = seeded(seed); S = Object.assign(newState(), JSON.parse(JSON.stringify(snap)));
  try { return EV[id].build(); } finally { Math.random = real; S = live; }
}
function restoreReport(){
  const P = S.pending, R = {...P.R, events:P.ids.map((id, i) => buildEvent(id, P.seeds[i], P.snap))};
  UI.modal = {kind:'report', R, step:P.step, outcome:P.outcome};
}
function nextYear(){
  UI.modal = null; S.pending = null; S.pendingNext = false;
  if (S.over || S.year >= MAX_YEAR){ S.screen = 'end'; render(); window.scrollTo(0, 0); return; }
  S.year++; S.age++;
  if (S.payout === 'annuity' && S.annLeft > 0){ S.cash += ANN_NET_M * 12; S.annLeft -= 12; }
  if (S.budget.mode === 'none') S.budget.monthly *= 1.3;
  if (S.svc.school > 0) S.svc.school--;
  render(); window.scrollTo(0, 0);
  toast(`Year ${S.year} begins. You’re ${S.age}.`);
}

function getVals(def){
  const v = UI.vals[UI.active] || (UI.vals[UI.active] = {});
  for (let pass = 0; pass < 2; pass++){
    for (const c of def.controls(v)){
      if (c.type === 'choice'){ const ok = c.options.filter(o => !o.disabled).map(o => String(o.v)); if (!ok.includes(String(v[c.key]))) v[c.key] = ok.includes(String(c.def)) ? String(c.def) : ok[0]; }
      else if (c.type === 'range'){ if (v[c.key] == null) v[c.key] = c.def; v[c.key] = clamp(v[c.key], c.min, Math.max(c.min, c.max)); }
      else if (c.type === 'check'){ if (v[c.key] == null) v[c.key] = c.def; }
    }
  }
  return v;
}
function tOf(c, val){ if (c.max <= c.min) return 0; return c.log ? Math.round(1000 * Math.log(val / c.min) / Math.log(c.max / c.min)) : Math.round(1000 * (val - c.min) / (c.max - c.min)); }

function chart(h, W = 320, H = 130){
  if (h.length < 2) return '<p class="muted small">Your net worth line starts after your first year.</p>';
  const pad = {l:44, r:10, t:10, b:22}, xs = h.map(p => p.year), ys = h.map(p => p.nw);
  let lo = Math.min(0, ...ys), hi = Math.max(...ys) * 1.08 || 1; const x = i => pad.l + (W - pad.l - pad.r) * (xs[i] - xs[0]) / Math.max(1, xs[xs.length - 1] - xs[0]), y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p.nw).toFixed(1)}`).join(' ');
  const area = `${x(0)},${y(lo)} ${pts} ${x(h.length - 1)},${y(lo)}`;
  const ticks = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${money(v, {k:true})}</text>`).join('');
  const xl = h.map((p, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${p.year === 0 ? 'Win' : 'Y' + p.year}</text>`).join('');
  const last = h.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth by year">${ticks}<polygon points="${area}" fill="var(--accent)" fill-opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(h[last].nw)}" r="4" fill="var(--accent)"/>${xl}</svg>`;
}
function viewModal(){
  const M = UI.modal; if (!M) return '';
  if (M.kind === 'confirmNew') return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mh"><h2 id="mt">Start over?</h2><p class="muted">Your current game will be lost.</p></div><div class="mf"><button class="btn" data-act="closemodal">Keep playing</button><button class="btn primary" data-act="reallynew">Start a new game</button></div></div></div>`;
  const R = M.R;
  if (M.step === -1){
    const ti = R.income.reduce((a, x) => a + x[1], 0), tc = R.costs.reduce((a, x) => a + x[1], 0), tg = R.invest.reduce((a, x) => a + x[2], 0) + R.assets.reduce((a, x) => a + x[1], 0);
    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="mh"><p class="stamp">YEAR ${R.year} REPORT</p><h2 id="mt">Net worth ${R.endNW >= R.startNW ? 'rose' : 'fell'} to ${money(R.endNW)}</h2><p class="muted">${money(R.endNW - R.startNW, {sign:true})} since the start of the year${R.crash ? '. The stock market crashed this year.' : '.'}</p></div>
      <div class="mb">
        <div class="rgrid">
          <div class="card" style="padding:14px"><h3>Money in and out</h3><div class="ledger">${R.income.map(x => `<span>${x[0]}</span><span class="num ${x[1] < 0 ? 'neg' : 'pos'}">${money(x[1], {sign:true})}</span>`).join('')}${R.costs.map(x => `<span>${x[0]}</span><span class="num neg">−${money(x[1])}</span>`).join('')}<span class="sum">Total</span><span class="sum num ${ti - tc < 0 ? 'neg' : 'pos'}">${money(ti - tc, {sign:true})}</span></div></div>
          <div class="card" style="padding:14px"><h3>Investments & property</h3>${R.invest.length || R.assets.length ? `<div class="ledger">${R.invest.map(x => `<span>${x[0]} <span class="muted">${pct(x[1])}</span></span><span class="num ${x[2] < 0 ? 'neg' : 'pos'}">${money(x[2], {sign:true})}</span>`).join('')}${R.assets.map(x => `<span>${x[0]}</span><span class="num ${x[1] < 0 ? 'neg' : 'pos'}">${money(x[1], {sign:true})}</span>`).join('')}<span class="sum">Change in value</span><span class="sum num ${tg < 0 ? 'neg' : 'pos'}">${money(tg, {sign:true})}</span></div>` : '<p class="muted small">Nothing invested. Your money didn’t grow this year, and inflation took about 3%.</p>'}</div>
        </div>
        ${R.biz ? `<p><b>Business:</b> ${esc(R.biz)}</p>` : ''}
        ${R.notes.map(n => n.t === 'bad' ? `<p class="neg"><b>${esc(n.s)}</b></p>` : `<p class="small muted">${esc(n.s)}</p>`).join('')}
        <div><h3 style="margin-bottom:8px">Your life</h3><div class="lifetable">${R.life.map(([l, a, b, why]) => { const d = Math.round(b) - Math.round(a); return `<b>${l}</b><span class="num ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'muted'}">${Math.round(a)} → ${Math.round(b)}</span><span class="muted">${esc(why)}</span>`; }).join('')}</div></div>
        ${S.reports.length > 1 ? `<div style="display:flex;flex-direction:column;gap:8px"><h3>Compare with past years</h3>${compareTable(S.reports, R.year, R.events.length ? R.year : null)}</div>` : ''}
        ${S.over === 'bankrupt' ? `<p class="neg"><b>Your debts now exceed everything you own. You file for bankruptcy.</b></p>` : ''}
      </div>
      <div class="mf"><button class="btn primary" data-act="nextstep">${R.events.length ? 'See what happened this year (' + R.events.length + ')' : S.over || S.year >= MAX_YEAR ? 'See how it all turned out' : 'Start year ' + (S.year + 1)}</button></div></div></div>`;
  }
  const ev = R.events[M.step];
  const last = M.step === R.events.length - 1;
  const nextLabel = last ? (S.over || S.year >= MAX_YEAR ? 'See how it all turned out' : 'Start year ' + (S.year + 1)) : 'Next';
  let body;
  if (M.outcome) body = effectCard(M.outcome, 'What happened', false, '');
  else body = `<div class="choices">${ev.choices.map((c, i) => `<button class="choice" data-choice="${i}" ${c.need && S.cash < c.need ? 'disabled' : ''}><b>${esc(c.label)}</b>${c.sub ? `<small>${esc(c.sub)}</small>` : ''}${c.need && S.cash < c.need ? `<small class="neg">Not enough cash (${money(S.cash)})</small>` : ''}</button>`).join('')}</div>`;
  return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><p class="stamp">YEAR ${R.year} · EVENT ${M.step + 1} OF ${R.events.length}</p><h2 id="mt">${esc(ev.title)}</h2></div>
    <div class="mb"><p class="evtext">${esc(ev.text)}${ev.dynamicLoss ? ` Your stocks and crypto lost ${money(-R.crashLoss)}.` : ''}</p>${body}</div>
    ${M.outcome ? `<div class="mf"><button class="btn primary" data-act="nextstep">${nextLabel}</button></div>` : ''}</div></div>`;
}
// Years side by side, oldest on the left. pendingYear is the year whose events haven't been played yet.
function compareTable(list, cur, pendingYear){
  const score = (s, i, k) => { const v = Math.round(s.m[k]), d = i ? v - Math.round(list[i - 1].m[k]) : 0;
    return v + (d ? ` <span class="${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : ''); };
  const signed = n => `<span class="${n < 0 ? 'neg' : n > 0 ? 'pos' : ''}">${money(n, {sign:true})}</span>`;
  const rows = [
    ['Net worth at year end', s => money(s.endNW)],
    ['Change during the year', s => signed(s.endNW - s.startNW)],
    ['Money in', s => money(s.moneyIn)],
    ['Money out', s => money(s.moneyOut)],
    ['Investments & property', s => signed(s.growth)],
    ['Cash', s => money(s.cash)],
    ['Invested', s => money(s.invested)],
    ['Debt', s => money(s.debt)],
    ['Happiness', (s, i) => score(s, i, 'happy')],
    ['Relationships', (s, i) => score(s, i, 'rel')],
    ['Safety', (s, i) => score(s, i, 'safety')],
    ['Health', (s, i) => score(s, i, 'health')],
    ['Stock market', s => s.crash ? '<span class="neg">Crashed</span>' : 'Normal'],
    ['What happened', s => s.year === pendingYear ? '<span class="muted">Coming up next</span>' : s.events.length ? s.events.map(esc).join('<br>') : '<span class="muted">A quiet year</span>']];
  return `<p class="small muted cmp-hint" hidden>Scroll the table sideways to see other years.</p><div class="cmp"><table>
    <thead><tr><th scope="col"><span class="visually-hidden">Measure</span></th>${list.map(s => `<th scope="col" class="${s.year === cur ? 'cur' : ''}">Year ${s.year}${s.year === cur ? ' · now' : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([label, f]) => `<tr><th scope="row">${label}</th>${list.map((s, i) => `<td class="${s.year === cur ? 'cur ' : ''}${label === 'What happened' ? 'ev' : 'num'}">${f(s, i)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
// Size year columns so a whole number of them fits beside the pinned labels, then open on the newest year.
// With scroll snapping on column edges, no year is ever left half-hidden under the labels.
function fitCmp(){
  document.querySelectorAll('.cmp').forEach(c => {
    const th = c.querySelectorAll('thead th'), years = th.length - 1, minW = innerWidth < 560 ? 88 : 170;
    const labels = c.querySelectorAll('tr > :first-child'); let k = years;
    for (let pass = 0; pass < 2; pass++){
      labels.forEach(x => { x.style.width = x.style.minWidth = x.style.maxWidth = ''; });   // measure the labels at their natural width
      const L = th[0].offsetWidth, avail = c.clientWidth - L; k = Math.max(1, Math.min(years, Math.floor(avail / minW)));
      // Whole-pixel year columns; the label column takes the leftover pixels so no sliver of a hidden year shows.
      const W = Math.floor(avail / k), Lfit = c.clientWidth - k * W;
      c.style.setProperty('--colw', W + 'px'); c.style.scrollPaddingLeft = Lfit + 'px';
      labels.forEach(x => { x.style.width = x.style.minWidth = x.style.maxWidth = Lfit + 'px'; });
    }
    const hint = c.previousElementSibling; if (hint && hint.classList.contains('cmp-hint')) hint.hidden = k >= years;
    c.scrollLeft = c.scrollWidth;
  });
}
addEventListener('resize', fitCmp);
function viewEnd(){
  const nw = netWorth(), pv = annPV(), total = nw + pv, m = S.m, life = (m.happy + m.rel + m.safety + m.health) / 4;
  const v = S.over === 'bankrupt' ? ['Broke.', 'Your debts outgrew everything you owned. You filed for bankruptcy.']
    : total >= 8e6 ? ['Generational wealth.', 'You grew the jackpot into a fortune that can outlive you.']
    : total >= 4e6 ? ['Set for life.', 'The money is working for you, and it will keep going.']
    : total >= 1.5e6 ? ['Comfortable, not rich.', 'You kept a meaningful cushion, but most of the jackpot is gone.']
    : total >= 3e5 ? ['Most of it slipped away.', 'A decade later, you’re only a little better off than before the ticket.']
    : ['The lottery curse.', 'Like many winners, you ended up about where you started, or worse.'];
  const lv = life >= 70 ? 'And your life feels genuinely good: healthy, safe, and close to the people you love.' : life >= 55 ? 'Life is decent. Some parts got better, some got harder.' : life >= 40 ? 'Life feels strained. Money changed things in ways you didn’t expect.' : 'The money cost you more than it gave: stress, distance, and fear.';
  const cats = Object.entries(S.spent).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]), mx = cats.length ? cats[0][1] : 1;
  return `<div class="stage" style="align-items:stretch;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px"><p class="stamp">TEN YEARS LATER · AGE ${S.age}</p><div class="verdict">${v[0]}</div><p style="font-size:18px;max-width:62ch">${v[1]} ${lv}</p></div>
    <section class="stats">
      <div class="stat hero"><span class="eyebrow">Net worth</span><span class="v">${money(nw)}</span><span class="s">Started with ${money(-33000)}</span></div>
      ${S.payout === 'annuity' ? `<div class="stat"><span class="eyebrow">Future payments</span><span class="v">${money(pv)}</span><span class="s">${Math.round(S.annLeft / 12)} years left, today’s value</span></div>` : ''}
      <div class="stat"><span class="eyebrow">Safe yearly income</span><span class="v">${money(liquid() * .04 + annNetYear())}</span><span class="s">4% of investments${S.payout === 'annuity' ? ' + annuity' : ''}</span></div>
      <div class="stat"><span class="eyebrow">Debt</span><span class="v">${money(S.debt)}</span><span class="s">${S.debt ? 'Still owed' : 'Debt-free'}</span></div>
      <div class="stat"><span class="eyebrow">Decisions made</span><span class="v">${S.decisions}</span><span class="s">Over ${S.year} years</span></div>
    </section>
    <section class="meters">${[['happy', 'Happiness'], ['rel', 'Relationships'], ['safety', 'Safety'], ['health', 'Health']].map(([k, l]) => `<div class="meter"><div class="row"><span>${l}</span><span class="num">${Math.round(m[k])}</span></div><div class="bar"><div class="fill" style="width:${m[k]}%;background:${meterColor(k, m[k])}"></div></div></div>`).join('')}</section>
    <div class="rgrid">
      <div class="card"><h3>Net worth over ten years</h3><div class="chart">${chart(S.history, 420, 170)}</div></div>
      <div class="card"><h3>Where the money went</h3><div class="spend">${cats.map(([c, a]) => `<div class="r"><span>${c}</span><div class="b" style="width:${Math.max(2, 100 * a / mx)}%"></div><span class="num" style="text-align:right">${money(a)}</span></div>`).join('') || '<p class="muted">You barely spent a thing.</p>'}</div></div>
    </div>
    ${S.reports.length ? `<div class="card"><h3>Year by year</h3>${compareTable(S.reports, null, null)}</div>` : ''}
    <div class="commitrow"><button class="btn foil" data-act="reallynew">Play again</button><span class="muted small">Try the ${S.payout === 'lump' ? 'monthly payments' : 'lump sum'} this time, or make the opposite choices.</span></div>
  </div>`;
}

/* ============ Interaction ============ */
/* ============ Confirmation ============ */
// Every decision waits for a Yes here. Event outcomes stay hidden until after the Yes, since many are random.
function picked(def){
  const v = getVals(def);
  return def.controls(v).filter(c => !(c.hide && c.hide(v))).map(c => {
    if (c.type === 'choice'){ const o = c.options.find(o => String(o.v) === String(v[c.key])); return o ? o.label : ''; }
    if (c.type === 'range') return c.max > c.min ? money(v[c.key], {full:true}) : '';
    return v[c.key] ? c.label : '';
  }).filter(Boolean).join(' · ');
}
function viewConfirm(){
  const C = UI.confirm; if (!C) return '';
  let title, body;
  if (C.kind === 'commit'){
    const def = D[UI.active], what = picked(def);
    title = def.title + '?';
    body = (what ? `<p class="evtext"><b>${esc(what)}</b></p>` : '') + effectCard(def.effect(getVals(def), S), 'What will happen', false, '');
  } else if (C.kind === 'claim'){
    title = `Claim ${UI.sel.payout === 'lump' ? 'the lump sum' : 'monthly payments'}${UI.sel.trust ? ' through a trust' : ''}?`;
    body = `<p class="evtext">You can’t change how you’re paid after you claim.</p>` + effectCard(claimEffect(UI.sel.payout, UI.sel.trust), 'What will happen', false, '');
  } else {
    const ev = UI.modal.R.events[UI.modal.step], c = ev.choices[C.i];
    title = c.label;
    body = `<p class="small muted">${esc(ev.title)}</p><p class="evtext">${c.sub ? esc(c.sub) + '. ' : ''}You’ll see how it turns out after you confirm.</p>`;
  }
  return `<div class="scrim top"><div class="modal confirm" role="alertdialog" aria-modal="true" aria-labelledby="ct">
    <div class="mh"><p class="stamp">ARE YOU SURE?</p><h2 id="ct">${esc(title)}</h2></div>
    <div class="mb">${body}</div>
    <div class="mf"><button class="btn" data-act="no">No</button><button class="btn primary" data-act="yes">Yes</button></div></div></div>`;
}
function doCommit(){
  const def = D[UI.active], E = def.effect(getVals(def), S); if (E.blocked){ render(); return; }
  applyEffect(E, def.title, def.cat); S.decisions++;
  UI.vals[UI.active] = {}; render(); toast('Done. See the effects log.');
}
function doChoice(i){
  const M = UI.modal, ev = M.R.events[M.step], c = ev.choices[i];
  const label = ev.title.replace(/[?.!]$/, '') + ': ' + c.label;   // "Who controls the money: Refuse…", not "…money?: Refuse…"
  const E = c.run(); applyEffect(E, label, 'Event'); lastReport().events.push(label); M.outcome = strip(E); render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.confirm){ UI.confirm = null; render(); } });

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function refreshPreview(){ const def = D[UI.active], v = getVals(def), E = def.effect(v, S); const p = document.getElementById('preview'); if (p) p.innerHTML = effectCard(E, 'If you do this', false, 'Preview'); const b = document.querySelector('[data-act="commit"]'); if (b) b.disabled = !!E.blocked; }
$app.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.range) return;
  const def = D[UI.active], v = getVals(def), c = def.controls(v).find(c => c.key === el.dataset.key);
  v[c.key] = vOf(c, +el.value); const o = document.getElementById(el.id + '-out'); if (o) o.textContent = money(v[c.key], {full:true});
  refreshPreview();
});
$app.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'trust'){ UI.sel.trust = el.checked; render(); return; }
  if (el.name === 'relstat'){ UI.sel.partner = el.value === '1'; render(); return; }
  if (!el.dataset || !el.dataset.key || el.dataset.range) return;
  const v = getVals(D[UI.active]); v[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'radio'){ const keep = el.id; document.getElementById('panel').innerHTML = viewPanel(D[UI.active]); const n = document.getElementById(keep); if (n) n.focus(); }
  else refreshPreview();
});
$app.addEventListener('click', e => {
  if (e.target.matches('.scrim.top')){ UI.confirm = null; render(); return; }   // tap outside a confirmation = No
  const t = e.target.closest('button,[data-pay]'); if (!t) return;
  if (t.dataset.pay){ UI.sel.payout = t.dataset.pay; render(); return; }
  if (t.dataset.nav){ UI.active = t.dataset.nav; render(); document.getElementById('panel').scrollIntoView({block:'nearest', behavior:'smooth'}); return; }
  if (t.dataset.quick){ const def = D[UI.active], v = getVals(def), c = def.controls(v).find(c => c.key === t.dataset.quick); v[c.key] = +t.dataset.f === 1 ? c.max : clamp(nice(c.max * +t.dataset.f), c.min, c.max); document.getElementById('panel').innerHTML = viewPanel(def); return; }
  if (t.dataset.choice != null){ UI.confirm = {kind:'choice', i:+t.dataset.choice}; render(); return; }
  const a = t.dataset.act; if (!a) return;
  if (a === 'yes'){ const C = UI.confirm; UI.confirm = null; if (C.kind === 'claim') doClaim(); else if (C.kind === 'commit') doCommit(); else doChoice(C.i); }
  else if (a === 'no'){ UI.confirm = null; render(); }
  else if (a === 'reveal'){ UI.revealed = true; render(); }
  else if (a === 'toclaim'){ S.screen = 'claim'; render(); window.scrollTo(0, 0); }
  else if (a === 'back'){ S.screen = 'ticket'; render(); }
  else if (a === 'claim'){ UI.confirm = {kind:'claim'}; render(); }
  else if (a === 'commit'){ const def = D[UI.active]; if (!def.effect(getVals(def), S).blocked){ UI.confirm = {kind:'commit'}; render(); } }
  else if (a === 'endyear') endYear();
  else if (a === 'nextstep'){
    const M = UI.modal; const R = M.R;
    if (M.step + 1 < R.events.length){
      M.step++; M.outcome = null; const ev = R.events[M.step];
      if (ev.pre) ev.pre(S);
      if (ev.auto){ const E = ev.auto(); applyEffect(E, ev.title, 'Event'); lastReport().events.push(ev.title); M.outcome = strip(E); }
      render();
    } else { S.history[S.history.length - 1].nw = netWorth(); snapYear(lastReport()); if (S.debt > 0 && netWorth() < -25000) S.over = 'bankrupt'; nextYear(); }
  }
  else if (a === 'newgame'){ UI.modal = {kind:'confirmNew'}; render(); }
  else if (a === 'closemodal'){ UI.modal = null; render(); }
  else if (a === 'reallynew'){ S = newState(); UI = newUI(); render(); window.scrollTo(0, 0); }
});

/* ============ Persistence ============ */
function save(){ try { localStorage.setItem('tenm-ticket', JSON.stringify({S, UI:{...UI, modal:null, confirm:null}})); } catch (e) {} }
function load(){ try { const d = JSON.parse(localStorage.getItem('tenm-ticket') || 'null'); if (d && d.S && d.S.screen) return d; } catch (e) {} return null; }
function start(data){
  const d = (data && data.S) ? data : load();
  if (d && d.S.screen !== 'ticket'){ S = Object.assign(newState(), d.S); UI = Object.assign(newUI(), d.UI || {}, {modal:null, confirm:null});
    if (S.pending) restoreReport();                        // reopen the year-end report where it was left
    else if (S.pendingNext){ nextYear(); return; } }       // saves from v1.5 and earlier kept no report to restore
  else { S = newState(); UI = newUI(); }
  render();
}
window.claude?.hot?.snapshot?.(() => ({S, UI:{...UI, modal:null, confirm:null}}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
