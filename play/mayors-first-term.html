<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.0">
<link rel="icon" href="../logo.svg">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Mayor's First Term</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a municipal ledger. Sticky seal bar on top, the mayor's desk (tabs) on the left, the city wire on the right. */
:root{
  --bg:#E6EBE8; --paper:#F8FAF8; --paper2:#EDF1EE; --ink:#13222A; --muted:#55666B; --line:#C6D1CD;
  --civic:#1B5960; --civic-on:#F1F7F5; --band:#1B5960; --band-ink:#EEF6F3; --band-muted:#A9C9C6;
  --sign:#E2AF2B; --sign-ink:#13222A; --sign-soft:#F6E6B8;
  --good:#2D7746; --warn:#9C6410; --bad:#AC392B;
  --bl:#3A67A6; --bc:#77689F; --br:#AD4535;
  --scrim:rgba(14,26,31,.55);
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181C; --paper:#15232A; --paper2:#1A2B32; --ink:#E2EAE7; --muted:#93A4A7; --line:#2B3D44;
  --civic:#6CBDBA; --civic-on:#0E181C; --band:#103238; --band-ink:#E3EFEC; --band-muted:#86ABA8;
  --sign:#E6B740; --sign-ink:#13222A; --sign-soft:#3B3220;
  --good:#62BE80; --warn:#E2A84A; --bad:#E6695B;
  --bl:#76A2E6; --bc:#A99BD8; --br:#E58272; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E181C; --paper:#15232A; --paper2:#1A2B32; --ink:#E2EAE7; --muted:#93A4A7; --line:#2B3D44;
  --civic:#6CBDBA; --civic-on:#0E181C; --band:#103238; --band-ink:#E3EFEC; --band-muted:#86ABA8;
  --sign:#E6B740; --sign-ink:#13222A; --sign-soft:#3B3220;
  --good:#62BE80; --warn:#E2A84A; --bad:#E6695B;
  --bl:#76A2E6; --bc:#A99BD8; --br:#E58272; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-stretch:72%;font-weight:850;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.btn{font:600 14px/1.1 var(--f-body);padding:10px 14px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--civic)}
.btn.primary{background:var(--civic);color:var(--civic-on);border-color:transparent}
.btn.sign{background:var(--sign);color:var(--sign-ink);border-color:transparent;font-family:var(--f-display);font-stretch:80%;font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:16px;padding:13px 18px}
.btn.small{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}
.pill.gold{background:var(--sign-soft);color:var(--ink);border-color:transparent}

/* seal bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:12px}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--sign);display:grid;place-items:center;font:800 13px/1 var(--f-display);font-stretch:70%;color:var(--sign);flex:none;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who h1{font-size:26px;color:var(--band-ink)}
.who>div{min-width:0}
.who h1,.who .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.who{flex:1 1 100%}}
.who .sub{font:500 12px/1.3 var(--f-mono);color:var(--band-muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto}
.stat .k{font:600 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted)}
.stat .v{font:600 17px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:4px;margin-top:4px}
.slots i{width:14px;height:14px;border-radius:3px;border:2px solid var(--sign);display:block}
.slots i.on{background:var(--sign)}
.tabs-row{background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:700 15px/1 var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;padding:14px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;padding-block:24px 64px;align-items:start}
.desk{display:flex;flex-direction:column;gap:28px;min-width:0}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.section-head h2{font-size:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px}

/* meters */
.meter{height:8px;background:var(--paper2);border-radius:4px;overflow:hidden;position:relative}
.meter>b{display:block;height:100%;background:var(--civic);border-radius:4px}
.meter.center>b{position:absolute;top:0}
.meter.center::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}

/* city hall */
.blocs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bloc{display:flex;flex-direction:column;gap:6px}
.bloc .big{font:600 30px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.bloc .trend{font:600 12px/1 var(--f-mono)}
@media (max-width:640px){.blocs{grid-template-columns:1fr}}
.depts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.depts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dept{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dept .name{font-weight:600;font-size:13px;line-height:1.25;min-height:2.5em}
.dept .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dept .score{font:600 24px/1 var(--f-mono)}
.dept .lab{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.overview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.overview{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.kv .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.spark{width:100%;height:70px;display:block}

.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .t{font-weight:600}
.act .h{font-size:13px;color:var(--muted)}
.act .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.act{grid-template-columns:1fr}.act .btns{justify-content:flex-start}}

/* budget */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--sign-soft);color:var(--ink)}
.banner.calm{background:var(--paper2)}
.sliders{display:flex;flex-direction:column}
.sl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 120px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sl:first-child{border-top:0}
.sl label{font-weight:600;font-size:14px}
.sl .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.sl .out{text-align:right;font:600 13px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.sl .out small{display:block;font-weight:400;color:var(--muted)}
.sl .out .chg{color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--civic)}
@media (max-width:640px){.sl{grid-template-columns:1fr auto}.sl input{grid-column:1 / -1;grid-row:2}}
.progs{width:100%;border-collapse:collapse;font-size:14px}
.tablebox{overflow-x:auto}
.progs th{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--ink)}
.progs td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.progs td.num{text-align:right;white-space:nowrap}
.progs tr.cut td{color:var(--muted)}
.progs tr.cut .pname{text-decoration:line-through}
.progs .note{font-size:12px;color:var(--muted)}
.toggle{font:600 12px/1 var(--f-mono);text-transform:uppercase;padding:6px 9px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.toggle.cut{background:var(--bad);color:var(--paper);border-color:transparent}
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px}
.ledger .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ledger .tot{border-top:2px solid var(--ink);padding-top:6px;font-weight:700}
.vote{display:flex;gap:3px;flex-wrap:wrap}
.vote i{width:16px;height:16px;border-radius:50%;background:var(--paper2);border:1px solid var(--line)}
.vote i.y{background:var(--good);border-color:transparent}
.vote i.n{background:var(--bad);border-color:transparent}

/* players */
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.players{grid-template-columns:1fr}}
.player{display:flex;flex-direction:column;gap:10px}
.player h3{font-size:20px}
.player .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.player .wants{font-size:13px;color:var(--muted)}
.player .chips{display:flex;gap:6px;flex-wrap:wrap}
.relrow{display:flex;align-items:center;gap:10px}
.relrow .meter{flex:1}
.relrow .num{font-weight:600;min-width:7ch;text-align:right;font-size:13px}

/* council */
.cmgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.cmgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cmgrid{grid-template-columns:1fr}}
.cmcard{display:flex;flex-direction:column;gap:8px;padding:14px}
.cmcard h3{font-size:19px}
.cmcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cmcard .wants{font-size:13px;color:var(--muted)}
.cmcard .chips{display:flex;gap:5px;flex-wrap:wrap}
.roll{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:24px}
.roll li{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.modal .roll{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.roll .dn{font:600 12px/1 var(--f-mono);color:var(--muted)}
.roll .who2{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:1.25}
.roll .who2 small{color:var(--muted);font-size:11px}

/* side */
.closeq{display:flex;flex-direction:column;gap:8px}
.wire{display:flex;flex-direction:column}
.wire li{list-style:none;padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.4;display:grid;grid-template-columns:54px 1fr;gap:8px}
.wire li:first-child{border-top:0}
.wire .when{font:600 11px/1.5 var(--f-mono);color:var(--muted)}
.wire .good{color:var(--good)}.wire .bad{color:var(--bad)}
.wire ul{margin:0;padding:0}
.promise{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-top:1px solid var(--line)}
.promise:first-of-type{border-top:0}
.promise .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.promise .t{font-weight:700;font-size:14px}
.promise .d{font-size:12px;color:var(--muted)}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:start center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{margin-block:auto;background:var(--paper);color:var(--ink);width:min(640px,100%);border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);overflow:hidden;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.memo-head{background:var(--band);color:var(--band-ink);padding:12px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.memo-head span:last-child{color:var(--band-muted)}
.memo-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.memo-body h2{font-size:34px}
.memo-body .lede{font-size:16px;line-height:1.55;max-width:62ch}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{appearance:none;text-align:left;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:7px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit}
.choice:hover:not(:disabled){border-color:var(--civic);background:var(--paper)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice b{font-size:15px}
.choice span{font-size:13px;color:var(--muted)}
.choice.sel{border-color:var(--civic);box-shadow:inset 0 0 0 1px var(--civic);background:var(--paper)}
.outcome{border-left:4px solid var(--sign);padding:4px 0 4px 12px;font-size:15px}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.delta{font:600 12px/1 var(--f-mono);padding:6px 8px;border-radius:4px;background:var(--paper2)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.nego-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.nego-grid{grid-template-columns:1fr}}
.odds{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper2);border-radius:7px}
.odds .num{font-size:28px;font-weight:600}
.result-big{font:900 64px/0.9 var(--f-display);font-stretch:65%;text-transform:uppercase}

/* setup */
.setup{padding-block:36px 64px;display:flex;flex-direction:column;gap:30px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.hero .seal{width:96px;height:96px;font-size:22px;border-width:3px;color:var(--civic);border-color:var(--civic)}
.hero h1{font-size:clamp(44px,8vw,96px);font-stretch:62%;font-weight:900}
.hero p{font-size:17px;max-width:60ch;margin-top:10px;color:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero .seal{width:72px;height:72px;font-size:17px}}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;border-top:2px solid var(--ink);padding-top:14px}
.step .n{font:900 40px/1 var(--f-display);font-stretch:62%;color:var(--civic)}
.step h2{font-size:26px;margin-bottom:4px}
.step .help{color:var(--muted);font-size:14px;margin-bottom:12px;max-width:65ch}
@media (max-width:560px){.step{grid-template-columns:1fr;gap:6px}}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field label{display:block;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:500 16px/1.2 var(--f-body);padding:11px 12px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.sizes{grid-template-columns:1fr}}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt[aria-pressed="true"]{border-color:var(--civic);box-shadow:inset 0 0 0 2px var(--civic)}
.opt .t{font:850 22px/1 var(--f-display);font-stretch:72%;text-transform:uppercase}
.opt .m{font:600 12px/1.4 var(--f-mono);color:var(--civic)}
.opt .d{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .opt{flex:1 1 120px;padding:10px 12px;align-items:center;text-align:center}
.seg .opt .t{font-size:17px}
.mix{display:flex;height:26px;border-radius:5px;overflow:hidden;margin-top:12px;font:600 11px/26px var(--f-mono);color:#fff}
.mix span{text-align:center;white-space:nowrap;overflow:hidden;transition:flex-basis .25s}
.chipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.chipgrid .opt .t{font-size:18px}
.counter{font:600 12px/1 var(--f-mono);color:var(--muted)}
.counter.ok{color:var(--good)}
.go{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px)}
</style>

</head>
<body>
<div id="app"></div>
<div id="modalWrap" class="modal-wrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ============ data ============ */
const SIZES={
  town:{label:'Town',pop:'28,000 residents',money:0.08,seats:5,events:[1,0],blurb:'Everyone has your cell number. A pothole is front-page news.'},

/* ============ fiscal model (annual "budget points"; 1 point = size.money $M) ============ */
function revenue(t=S.tax){
  const prop=470*(t.prop/1.1),sales=290*(t.sales/1.5)*(1-.12*Math.max(0,t.sales-1.5)),fees=110*t.fees;
  const aid=90*(has('governor')?1+S.rel.governor/400:1);
  const local=(prop+sales+fees)*S.econ;
  return {prop:prop*S.econ,sales:sales*S.econ,fees:fees*S.econ,aid,adj:S.revAdj,total:local+aid+S.revAdj};
}
function spending(b=S.budget,progs=S.programs,pets=S.pets){
  let depts=0;DEPTS.forEach(d=>depts+=d.base*b[d.id]/100);
  let pr=0;PROGRAMS.forEach(p=>{if(progs[p.id])pr+=p.cost});
  let dp=0;S.council.forEach(m=>{if(pets[m.id])dp+=m.pet.cost});
  const debt=25+Math.max(0,-S.treasury)*.08+S.debtAdj;
  return {depts,programs:pr,districts:dp,debt,other:S.spendAdj,total:depts+pr+dp+debt+S.spendAdj};
}
function target(d,b=S.budget,progs=S.programs,pets=S.pets){
  let t=50+(b[d]-100)*1.1;PROGRAMS.forEach(p=>{if(p.dept===d&&progs[p.id])t+=p.boost});
  S.council.forEach(m=>{if(m.pet.dept===d&&pets[m.id])t+=2});
  return clamp(t+(S.qBonus[d]||0),5,98);
}

/* ============ city council: one member per district ============ */
function makeCouncil(seats,pop,mayorLean){
  const names=[...CM_NAMES].sort(()=>Math.random()-.5),used={L:0,C:0,R:0};
  const order=['L','C','R'].flatMap(b=>Array(Math.round(pop[b]*seats)).fill(b));
  while(order.length<seats)order.push('C');order.length=seats;order.sort(()=>Math.random()-.5);
  const traits=Object.keys(TRAITS);
  return order.map((b,i)=>{const k=used[b]++;const base=PETS[b][k%PETS[b].length];
    const lean={L:-.7,C:0,R:.7}[b];
    return {id:'d'+(i+1),n:i+1,name:names[i],bloc:b,district:DISTRICTS[b][k%DISTRICTS[b].length],
      trait:chance(.6)?pick(traits):null,rel:Math.round(10-Math.abs(lean-mayorLean)*25+rnd(-10,10)),
      pet:{name:base.name+(k>=PETS[b].length?' (phase 2)':''),dept:base.dept,cost:base.cost},voteP:false,endorse:false}});
}
function memberScore(m,p=S.pend){
  const B=BLOCS[m.bloc];let s=.5+m.rel/150+(approval()-50)/150,align=0;
  DEPTS.forEach(d=>align+=(p.budget[d.id]-S.budget[d.id])*B.w[d.id]*.02);
  const hike=(p.tax.prop-S.tax.prop)/.1+(p.tax.sales-S.tax.sales)/.25+(p.tax.fees-S.tax.fees)/.1;
  align-=hike*B.tax*.03;
  PROGRAMS.forEach(pr=>{if(S.programs[pr.id]&&!p.programs[pr.id]){
    if(!pr.low&&pr.fanBloc===m.bloc)align-=.06;
    if(!pr.low&&m.trait==='oldguard')align-=.05;
    if(pr.low&&m.trait==='principled')align+=.02}});
  s+=align*(m.trait==='principled'?1.5:1);
  if(p.pets[m.id])s+=.2;
  if(S.pets[m.id]&&!p.pets[m.id])s-=.3;
  if(m.trait==='principled')S.council.forEach(o=>{if(o!==m&&p.pets[o.id]&&!S.pets[o.id])s-=.02});
  // members judge the change in the deficit, not the deficit you inherited
  const dBal=(revenue(p.tax).total-spending(p.budget,p.programs,p.pets).total)-(revenue().total-spending().total);
  const hawk={L:.6,C:1,R:1.5}[m.bloc];
  s+=dBal<0?-Math.min(.15,-dBal/250)*hawk:Math.min(.08,dBal/400)*hawk;
  if(m.voteP)s+=.35;
  return s;
}
function stance(s){return STANCE.find(x=>s>=x[0])}
function fundamental(b){
  const B=BLOCS[b];let svc=0;for(const d in B.w)svc+=B.w[d]*S.svc[d];
  const t=S.tax;const taxPain=B.tax*((t.prop-1.1)*25+(t.sales-1.5)*8+(t.fees-1)*15);
  const defPain=S.treasury<0?({L:.4,C:1,R:1.5}[b])*Math.min(12,-S.treasury/20):0;
  const p=S.perception;const perc=b==='L'?-p*.08:b==='C'?-Math.abs(p)*.02:p*.04;
  return 15+svc*.7-taxPain-defPain+perc+(S.integrity-60)*.15+(S.scandal?-4:0);
}

  ['L','C','R'].forEach(b=>{let a=55+rnd(-4,4);c.promises.forEach(p=>{if(PROMISES[p].blocs[b])a+=1.5*PROMISES[p].blocs[b]});S.blocs[b]={appr:a,mood:0}});

function syncPend(){S.pend={budget:{...S.budget},tax:{...S.tax},programs:{...S.programs},pets:{...S.pets}};
  (S.commitments||[]).forEach(c=>{if(c.m)S.pend.pets[c.m]=true})}
// saves from before the council update get a council on load
function upgradeSave(s){
  if(s&&!s.council){const prev=S;S=s;s.council=makeCouncil(SIZES[s.size].seats,s.pop,s.mayorLean||0);
    const r=s.rel.council||0;s.council.forEach(m=>m.rel=Math.round(m.rel/2+r));delete s.rel.council;s.pets={};syncPend();S=prev}
  return s;
}

/* ============ quarter flow ============ */
function startQuarter(){
  S.slots=Math.max(0,3-S.slotPenalty);S.slotPenalty=0;
  S.budgetSession=(S.q-1)%4===0;S.budgetSubmitted=false;syncPend();
  const q=[];
  if(S.q===1)q.push('inaug');
  if(S.q===13)q.push('challenger');
  if(S.q===16)q.push('debate1','debate2','debate3');
  if(S.scandalPending){q.push('scandal');S.scandalPending=false}
  if(S.stress>=75&&cool('burnout',3))q.push('burnout');
  if(S.family<30&&cool('familycrisis',3))q.push('familycrisis');
  const [n,extra]=SIZES[S.size].events;let draws=n+(chance(extra)?1:0);
  if(S.q===1||S.q===16)draws=Math.max(0,draws-1);
  for(let i=0;i<draws;i++){const e=drawEvent(q);if(e)q.push(e)}
  S.queue=q;save();render();nextEvent();
}
function cool(id,n){return S.seen[id]===undefined||S.q-S.seen[id]>=n}
function drawEvent(already){
  const pool=EVENTS.filter(e=>!e.special&&!already.includes(e.id)&&(e.repeat?cool(e.id,e.repeat):!S.used.includes(e.id))&&(!e.fac||has(e.fac))&&(!e.labor||!peace(e.fac))&&(!e.cond||e.cond()));
  if(!pool.length)return null;
  let tot=pool.reduce((s,e)=>s+(e.w||1),0),r=Math.random()*tot;
  for(const e of pool){r-=(e.w||1);if(r<=0)return e.id}
  return pool[0].id;
}
function endQuarter(){
  const before={appr:approval(),blocs:Object.fromEntries(['L','C','R'].map(b=>[b,S.blocs[b].appr])),q:{...S.svc},treasury:S.treasury,econ:S.econ};
  const rev=revenue(),sp=spending();const net=(rev.total-sp.total)/4;
  S.treasury+=net;
  DEPTS.forEach(d=>{const t=target(d.id);S.svc[d.id]=clamp(S.svc[d.id]+(t-S.svc[d.id])*.24+rnd(-2,2),0,100)});
  for(const k in S.qBonus)S.qBonus[k]*=.5;
  const t=S.tax;const drag=.004*((t.prop-1.1)/.3)+.003*((t.sales-1.5)/.5)+.004*((t.fees-1)/.15);
  S.econ=clamp(S.econ+.003+(S.svc.econ-50)*.0001+(S.svc.roads-50)*.00006-drag+rnd(-.006,.006)+S.econShock,.75,1.35);S.econShock=0;
  // voters: this quarter's news lands, then opinion drifts toward fundamentals
  ['L','C','R'].forEach(b=>{const B=S.blocs[b];B.appr+=B.mood;B.mood=0;B.appr=clamp(B.appr+(fundamental(b)-B.appr)*.2,3,97)});
  // players
  const taxIdx=(t.prop-1.1)/.1+(t.sales-1.5)/.25+(t.fees-1)/.1;
  for(const f in S.rel){const F=FACTIONS[f];let d=-S.rel[f]*.03;
    if(F.dept){d+=clamp((S.budget[F.dept]-100)*.06,-3,3);if(F.labor&&S.budget[F.dept]<95)d-=1}
    if(F.taxLow)d-=taxIdx*.5;
    if(f==='ledger')d+=(S.integrity-60)*.04;
    S.rel[f]=clamp(S.rel[f]+d,-100,100)}
  // council members: popularity helps, a funded district project keeps them sweet
  S.council.forEach(m=>{crel(m,-m.rel*.03+(approval()-50)*.05+(S.pets[m.id]?1:0)+(m.trait==='ambitious'?-1.5:0)+(S.blocs[m.bloc].appr-50)*.03)});
  // commitments
  S.commitments=S.commitments.filter(c=>{if(c.due!==S.q)return true;
    if(c.m){const m=cm(c.m);
      if(S.pets[c.m]){crel(m,5);news(`Council member ${m.name} thanks you for funding the ${m.pet.name}.`,'good')}
      else{crel(m,-35);integ(-4);rel('council',-3);crel(m,3);news(`${m.name} (District ${m.n}): “The mayor promised the ${m.pet.name} and walked away.”`,'bad')}
      return false}
    if(S.budget[c.dept]>=c.min){rel(c.f,5);news(`${FACTIONS[c.f].name} credit you for keeping your word on ${DN[c.dept]}.`,'good')}
    else{rel(c.f,-30);integ(-5);news(`${FACTIONS[c.f].name}: “The mayor broke a promise to us.”`,'bad')}
    return false});
  // private life
  stress(6);fam(-5);expo(-2);
  if(S.stress>=100){S.slotPenalty=2;S.stress=60;news(`${S.mayor} hospitalized for exhaustion; schedule cleared.`,'bad')}
  if(S.family<=0){S.family=20;expo(15);mood('all',-3);news('Tabloids report trouble at home for the mayor.','bad')}
  // scandal risk
  const sp2=S.exposure/300*(has('ledger')?1-S.rel.ledger/200:.8);
  if(!S.scandal&&chance(sp2))S.scandalPending=true;
  if(S.scandal&&chance(.4))S.scandal=false;
  // annual promise check
  if(S.q%4===0)S.promises.forEach(id=>{const P=PROMISES[id];const ok=P.check();for(const b in P.blocs)mood(b,(ok?1:-1)*P.blocs[b]);
    news(`Report card: “${P.name}” is ${ok?'on track':P.broken&&P.broken()?'broken':'behind'}.`,ok?'good':'bad')});
  // opponent grows
  if(S.opp)S.opp.chest+=30+Object.keys(S.rel).filter(f=>S.rel[f]<=-40&&FACTIONS[f].donor).length*8;
  // wire
  DEPTS.forEach(d=>{const a=before.q[d.id],b=S.svc[d.id];if(a>=45&&b<45)news(`${DN[d.id]} slipping: residents report longer waits.`,'bad');if(a<70&&b>=70)news(`${DN[d.id]} earns top marks in a citizen survey.`,'good')});
  if(before.treasury>=0&&S.treasury<0)news('City reserve runs dry; Finance begins short-term borrowing.','bad');
  if(S.econ-before.econ>.008)news('Hiring picks up across the city.','good');
  if(S.econ-before.econ<-.008)news('Storefront vacancies tick up downtown.','bad');
  const a=approval();S.history.push(a);
  if(S.treasury<-300)S.over='bankrupt';
  if(a<25){S.lowStreak++;if(S.lowStreak>=2)S.over='recall'}else S.lowStreak=0;
  if(S.integrity<8)S.over='resign';
  const report={q:S.q,rev,sp,net,before,after:{appr:a,blocs:Object.fromEntries(['L','C','R'].map(b=>[b,S.blocs[b].appr])),q:{...S.svc},treasury:S.treasury,econ:S.econ}};
  S.q++;save();showReport(report);
}
function afterReport(){
  if(S.over){showEnding(S.over);return}
  if(S.q>16){showElection();return}
  startQuarter();
}

/* ============ opponent & election ============ */
function makeOpp(){
  if(S.opp)return;
  const w=weakestBloc();
  const pitch={L:'A council member running to your left, promising rent control and free buses.',R:'A business owner running on lower taxes and more police.',C:'A popular former school principal running as the “competent, boring” option.'}[w];
  const hostile=Object.keys(S.rel).filter(f=>S.rel[f]<=-40).length;
  S.opp={name:pick(OPP_NAMES),side:w,pitch,chest:220+Math.max(0,55-approval())*5+hostile*30+rnd(0,60)};
}
function electionFactors(noise=0){
  const a=approval();const f=[];
  f.push(['Your approval ('+a.toFixed(0)+'%)',(a-50)*.8]);
  f.push(['Money raised vs. '+S.opp.name,clamp((S.raised-S.opp.chest)/60,-4,4)]);
  f.push(['Ground game',Math.min(5,S.reach*.3)]);
  let e=0;const ends=[],hostile=[];
  for(const k in S.rel){if(S.rel[k]>=40||(S.pledged[k]&&S.rel[k]>=10)){e+=k==='ledger'?2:1.5;ends.push(FACTIONS[k].name)}else if(S.rel[k]<=-40){e-=1;hostile.push(FACTIONS[k].name)}}
  const cms=S.council.filter(m=>m.rel>=40||(m.endorse&&m.rel>=10));
  if(cms.length){e+=Math.min(2.5,cms.length*.35)+(cms.length>S.council.length/2?.5:0);ends.push(cms.length===1?'Council member '+cms[0].name:cms.length+' council members')}
  f.push(['Endorsements ('+ends.length+' for, '+hostile.length+' against)',e]);
  let p=0;S.promises.forEach(id=>p+=PROMISES[id].check()?2:-3.5);
  f.push(['Promises kept',p]);
  f.push(['Debate',clamp(S.debate,-3,4)]);
  f.push(['Incumbency',1]);
  if(S.scandal)f.push(['Active scandal',-3]);
  if(noise)f.push(['Election-night swing',noise]);
  return {f,ends,hostile,share:clamp(50+f.reduce((s,x)=>s+x[1],0),18,82)};
}

function doAction(id,arg){
  const A=ACTIONS[id];if(S.slots<A.cost){toast('No agenda slots left this quarter. Close the quarter to continue.');return}
  const before=snap();S.slots-=A.cost;const out=A.run(arg);save();render();
  showOutcome('Agenda',A.title||'Done',out,before);

/* ============ diff chips ============ */
function snap(){return JSON.parse(JSON.stringify({treasury:S.treasury,chest:S.chest,integrity:S.integrity,stress:S.stress,family:S.family,econ:S.econ,perception:S.perception,reach:S.reach,exposure:S.exposure,mood:{L:S.blocs.L.mood,C:S.blocs.C.mood,R:S.blocs.R.mood},rel:S.rel,q:S.svc,budget:S.budget,revAdj:S.revAdj,spendAdj:S.spendAdj,econShock:S.econShock,slots:S.slots,cm:S.council.map(m=>m.rel)}))}
function diffChips(a){
  const out=[];const c=(label,d,up=true)=>out.push(`<span class="delta ${(d>0)===up?'up':'down'}">${esc(label)}</span>`);
  const d=(k)=>S[k]-a[k];
  if(Math.abs(d('treasury'))>=.5)c('City reserve '+(d('treasury')>0?'+':'−')+money(Math.abs(d('treasury'))),d('treasury'));
  if(Math.abs(d('chest'))>=.5)c('War chest '+(d('chest')>0?'+':'−')+cmoney(Math.abs(d('chest'))),d('chest'));
  ['L','C','R'].forEach(b=>{const x=S.blocs[b].mood-a.mood[b];if(Math.abs(x)>=.5)c(`${BLOCS[b].name} voters ${sgn(x)}`,x)});
  for(const f in S.rel){const x=S.rel[f]-a.rel[f];if(Math.abs(x)>=.5)c(`${FACTIONS[f].name} ${sgn(x)}`,x)}
  const cd=S.council.map((m,i)=>m.rel-a.cm[i]);
  if(cd.every(x=>Math.abs(x-cd[0])<.01)&&Math.abs(cd[0])>=.5)c(`City Council (all members) ${sgn(cd[0])}`,cd[0]);
  else S.council.forEach((m,i)=>{if(Math.abs(cd[i])>=.5)c(`${m.name} (D${m.n}) ${sgn(cd[i])}`,cd[i])});
  for(const k in S.svc){const x=S.svc[k]-a.q[k];if(Math.abs(x)>=.5)c(`${DN[k]} ${sgn(x)}`,x)}
  for(const k in S.budget){const x=S.budget[k]-a.budget[k];if(x)c(`${DN[k]} funding ${sgn(x)}%`,x)}
  if(Math.abs(d('integrity'))>=.5)c('Integrity '+sgn(d('integrity')),d('integrity'));
  if(Math.abs(d('exposure'))>=.5)c('Scandal exposure '+sgn(d('exposure')),d('exposure'),false);
  if(Math.abs(d('stress'))>=.5)c('Stress '+sgn(d('stress')),d('stress'),false);
  if(Math.abs(d('family'))>=.5)c('Family '+sgn(d('family')),d('family'));
  if(Math.abs(d('reach'))>=.5)c('Ground game '+sgn(d('reach')),d('reach'));
  const ec=(S.econShock-a.econShock)+(S.econ-a.econ);if(Math.abs(ec)>=.001)c('Economy '+sgn(ec*100,1)+'%',ec);
  if(d('revAdj'))c('Annual revenue '+(d('revAdj')>0?'+':'−')+money(Math.abs(d('revAdj'))),d('revAdj'));
  if(d('spendAdj'))c('Annual costs +'+money(d('spendAdj')),-1);
  if(Math.abs(d('perception'))>=.5)out.push(`<span class="delta">Image: more ${d('perception')>0?'establishment':'grassroots'}</span>`);
  if(S.slots<a.slots)out.push(`<span class="delta down">Agenda slots −${a.slots-S.slots}</span>`);
  return out.join('');
}

/* ============ modal plumbing ============ */
function openModal(html){$('#modal').innerHTML=html;$('#modalWrap').hidden=false;const f=$('#modal button');if(f)f.focus({preventScroll:true});$('#modalWrap').scrollTop=0}
function closeModal(){$('#modalWrap').hidden=true;$('#modal').innerHTML='';CUR=null}
function memoHead(kicker){return `<div class="memo-head"><span>Memo · ${esc(kicker)}</span><span>To Mayor ${esc(S.mayor)} · ${when(Math.min(S.q,16))}</span></div>`}
function nextEvent(){
  if(!S.queue.length){closeModal();render();return}
  const id=S.queue[0];const e=EVENTS.find(x=>x.id===id);
  if(!e){S.queue.shift();nextEvent();return}
  const body=typeof e.body==='function'?e.body():e.body;
  const ch=typeof e.choices==='function'?e.choices():e.choices;
  CUR={e,ch,before:snap()};
  openModal(`${memoHead(e.kicker)}<div class="memo-body"><h2 id="mtitle">${esc(e.title)}</h2><p class="lede">${esc(body)}</p>
    <div class="choices">${ch.map((c,i)=>`<button class="choice" data-choice="${i}"><b>${esc(c.t)}</b>${c.h?`<span>${esc(c.h)}</span>`:''}</button>`).join('')}</div></div>`);
}
function resolveChoice(i){
  const {e,ch,before}=CUR;const out=ch[i].f()||'';
  S.queue.shift();if(!e.special&&!e.repeat)S.used.push(e.id);S.seen[e.id]=S.q;
  if(!e.special||e.id==='scandal')news(`${e.title}: ${ch[i].t.toLowerCase()}.`);
  save();render();
  const more=S.queue.length;
  openModal(`${memoHead(e.kicker)}<div class="memo-body"><h2 id="mtitle">${esc(e.title)}</h2><p class="outcome">${esc(out)}</p>
    <div class="deltas">${diffChips(before)}</div><div class="foot"><button class="btn primary" data-next>${more?'Next memo ('+more+' left)':'Back to the desk'}</button></div></div>`);
}
function showOutcome(kicker,title,out,before){
  openModal(`${memoHead(kicker)}<div class="memo-body"><p class="outcome" id="mtitle">${esc(out)}</p><div class="deltas">${diffChips(before)}</div>
  <div class="foot"><button class="btn primary" data-close>Back to the desk</button></div></div>`);
}

/* ============ negotiation ============ */
const ASKS={
  endorse:{t:'Endorse my re-election',h:'They back you on Election Day if relations stay warm',d:.3},
  peace:{t:'Keep disputes private for a year',h:'No strikes or public fights from them for four quarters',d:.1},
  donate:{t:'Donate to my campaign',h:'Money for the war chest',d:.15},
  support:{t:'Help deliver results',h:'They put their weight behind your work',d:.15},
  goodwill:{t:'Nothing today, just talk',h:'An easy meeting that builds trust',d:-.15}
};
function supportLabel(f){const F=FACTIONS[f];return F.support||`Help deliver on ${DN[F.dept]}`}
function negoAsks(f){const F=FACTIONS[f];return Object.keys(ASKS).filter(a=>!(a==='endorse'&&S.pledged[f])&&!(a==='donate'&&!F.donor)&&!(a==='peace'&&peace(f)))}
function negoOffers(f){const F=FACTIONS[f];const o=[];
  if(F.dept)o.push({id:'commit',t:`Fund ${DN[F.dept]} at 110%+ in the next budget`,h:'A promise they will hold you to',v:.3});
  o.push({id:'appear',t:'A joint public appearance',h:'Shifts how voters see you',v:.12});
  o.push({id:'concede',t:F.concession,h:'A real policy concession',v:.25});
  o.push({id:'none',t:'Appeal to shared goals',h:'Costs nothing',v:0});return o}
function negoOdds(){const o=negoOffers(NEGO.f).find(x=>x.id===NEGO.offer);return clamp(.35+S.rel[NEGO.f]/160+(o?o.v:0)-ASKS[NEGO.ask].d,.05,.95)}
function openNego(f){NEGO={f,ask:negoAsks(f)[0],offer:'none'};renderNego()}
function renderNego(){
  const f=NEGO.f,F=FACTIONS[f];const [rl]=relLabel(S.rel[f]);const p=negoOdds();
  openModal(`<div class="memo-head"><span>Negotiation · ${esc(F.name)}</span><span>Relations: ${rl} (${Math.round(S.rel[f])})</span></div>
  <div class="memo-body"><h2 id="mtitle">Sit down with ${esc(F.name)}</h2><p class="muted">${esc(F.blurb)}</p>
  <div class="nego-grid"><div class="section"><div class="eyebrow">What you ask for</div><div class="choices">
  ${negoAsks(f).map(a=>`<button class="choice ${NEGO.ask===a?'sel':''}" data-ask="${a}" aria-pressed="${NEGO.ask===a}"><b>${esc(a==='support'?supportLabel(f):ASKS[a].t)}</b><span>${esc(ASKS[a].h)}</span></button>`).join('')}</div></div>
  <div class="section"><div class="eyebrow">What you offer</div><div class="choices">
  ${negoOffers(f).map(o=>`<button class="choice ${NEGO.offer===o.id?'sel':''}" data-offer="${o.id}" aria-pressed="${NEGO.offer===o.id}"><b>${esc(o.t)}</b><span>${esc(o.h)}</span></button>`).join('')}</div></div></div>
  <div class="odds"><span class="num">${Math.round(p*100)}%</span><span class="muted">chance they say yes. Uses 1 agenda slot. A refusal cools relations a little.</span></div>
  <div class="foot"><button class="btn" data-close>Walk away</button><button class="btn primary" data-pitch ${S.slots<1?'disabled':''}>Make the pitch</button></div></div>`);
}
function pitch(){
  const f=NEGO.f,F=FACTIONS[f];const before=snap();S.slots--;stress(3);
  const o=negoOffers(f).find(x=>x.id===NEGO.offer);let out;
  if(chance(negoOdds())){
    rel(f,6+o.v*20);
    if(o.id==='commit'){const due=S.budgetSession&&!S.budgetSubmitted?S.q:Math.min(16,S.q+(4-(S.q-1)%4));S.commitments.push({f,dept:F.dept,min:110,due})}
    if(o.id==='appear'){if(F.lean<-.2){mood('L',2);mood('R',-1)}else if(F.lean>.2){mood('R',2);mood('L',-1)}else mood('C',1);percep(F.corp?4:F.labor?-3:0)}
    if(o.id==='concede')concede(f);
    const a=NEGO.ask;
    if(a==='endorse')S.pledged[f]=true;
    if(a==='peace')S.peace[f]=S.q+3;
    if(a==='donate'){raise(F.donor*(1+S.rel[f]/200));if(F.corp)percep(6);if(F.labor)percep(-3)}
    if(a==='support'){if(F.dept){qual(F.dept,5);S.qBonus[F.dept]=(S.qBonus[F.dept]||0)+4}else if(f==='governor')cash(35);else{integ(3);mood('C',2)}}
    out=`Handshakes all around. ${F.name} agree${a==='endorse'?' to endorse you':a==='peace'?' to keep things private for a year':a==='donate'?' to write a check':a==='support'?' to help':' to keep talking'}.`;
    if(o.id==='commit')out+=` They expect ${DN[F.dept]} at 110% or more in the next budget.`;
  }else{rel(f,-2);out=`${F.name} listen politely, then say no.`}
  save();render();showOutcome('Negotiation',F.name,out,before);
}
function concede(f){
  ({police:()=>{bump('safety',5);mood('L',-1)},teachers:()=>bump('schools',5),
    chamber:()=>{S.tax.fees=clamp(+(S.tax.fees-.1).toFixed(2),.7,1.3);S.pend.tax.fees=S.tax.fees},
    developers:()=>{qual('housing',3);expo(8);rel('neighbors',-8)},green:()=>{S.econShock-=.005;percep(-4);mood('R',-2);mood('L',2)},
    transit:()=>{bump('roads',3);S.flags.noRouteCuts=true},neighbors:()=>{qual('housing',-4);rel('developers',-10)},
    tech:()=>{S.econShock+=.005;mood('L',-1)},faith:()=>{qual('housing',2);cash(-5)},ledger:()=>{integ(2);rel('council',-4)},
    governor:()=>{percep(4);mood(S.govLean>0?'L':'R',-3)},sports:()=>{cash(-5);S.flags.stadiumStudy=true}}[f]||(()=>{}))();
}

/* ============ budget ============ */
function councilVote(){
  const members=S.council.map(m=>{const s=memberScore(m);return {m,s,yes:s>.5}});
  const yes=members.filter(x=>x.yes).length,seats=S.council.length;
  return {yes,no:seats-yes,seats,pass:yes>seats/2,members};
}
function pendChanged(){const p=S.pend;return DEPTS.some(d=>p.budget[d.id]!==S.budget[d.id])||['prop','sales','fees'].some(k=>Math.abs(p.tax[k]-S.tax[k])>1e-9)||PROGRAMS.some(x=>p.programs[x.id]!==S.programs[x.id])||S.council.some(m=>!!p.pets[m.id]!==!!S.pets[m.id])}

/* ============ council member meetings ============ */
const CM_ASKS={
  vote:{t:'Vote yes on my next budget',h:'A firm vote, as long as you keep your side of the deal',d:.05},
  endorse:{t:'Endorse my re-election',h:'Counts on Election Day if relations stay warm',d:.3},
  back:{t:'Talk up my agenda in the district',h:'Their voters warm to you',d:.15},
  talk:{t:'Nothing today, just talk',h:'Builds trust',d:-.15}
};
function cmAsks(m){return Object.keys(CM_ASKS).filter(a=>!(a==='vote'&&m.voteP)&&!(a==='endorse'&&m.endorse))}
function cmOffers(m){const o=[];
  if(!S.pets[m.id]&&!S.commitments.some(c=>c.m===m.id))o.push({id:'pet',t:`Fund the ${m.pet.name}`,h:`${money(m.pet.cost)}/yr, added to your pending budget. They will hold you to it.`,v:.35});
  o.push({id:'townhall',t:`A joint town hall in ${m.district}`,h:'Good for both of you with district voters',v:.12});
  o.push({id:'board',t:'Appoint their ally to the Planning Board',h:m.trait==='principled'?'This one finds patronage insulting':'Patronage. Reporters notice.',v:m.trait==='principled'?-.3:.2});
  o.push({id:'cosponsor',t:'Co-sponsor their ordinance',h:'Members from other blocs will grumble',v:.15});
  o.push({id:'none',t:'Appeal to the good of the city',h:'Costs nothing',v:0});return o}
function cmOdds(){const m=cm(NEGO.m);const o=cmOffers(m).find(x=>x.id===NEGO.offer)||{v:0};
  return clamp(.35+m.rel/160+o.v-CM_ASKS[NEGO.ask].d-(NEGO.ask==='endorse'&&m.trait==='ambitious'?.2:0)+(m.trait==='dealmaker'?.1:0),.05,.95)}
function openCmNego(id){const m=cm(id);NEGO={m:id,ask:cmAsks(m)[0],offer:cmOffers(m)[0].id};renderCmNego()}
function renderCmNego(){
  const m=cm(NEGO.m);const [rl]=relLabel(m.rel);const p=cmOdds();const [,sl,sc]=stance(memberScore(m));
  openModal(`<div class="memo-head"><span>Council office · District ${m.n}</span><span>Relations: ${rl} (${Math.round(m.rel)})</span></div>
  <div class="memo-body"><h2 id="mtitle">Meet ${esc(m.name)}</h2>
  <p class="muted">${BLOCS[m.bloc].name} member for ${esc(m.district)}. ${m.trait?esc(TRAITS[m.trait].name+': '+TRAITS[m.trait].h):''} Wants the <b>${esc(m.pet.name)}</b>${S.pets[m.id]?' (funded)':''}. On your pending budget: <span class="pill ${sc}">${sl}</span></p>
  <div class="nego-grid"><div class="section"><div class="eyebrow">What you ask for</div><div class="choices">
  ${cmAsks(m).map(a=>`<button class="choice ${NEGO.ask===a?'sel':''}" data-cmask="${a}" aria-pressed="${NEGO.ask===a}"><b>${esc(CM_ASKS[a].t)}</b><span>${esc(CM_ASKS[a].h)}</span></button>`).join('')}</div></div>
  <div class="section"><div class="eyebrow">What you offer</div><div class="choices">
  ${cmOffers(m).map(o=>`<button class="choice ${NEGO.offer===o.id?'sel':''}" data-cmoffer="${o.id}" aria-pressed="${NEGO.offer===o.id}"><b>${esc(o.t)}</b><span>${esc(o.h)}</span></button>`).join('')}</div></div></div>
  <div class="odds"><span class="num">${Math.round(p*100)}%</span><span class="muted">chance of a deal. Uses 1 agenda slot.</span></div>
  <div class="foot"><button class="btn" data-close>Walk away</button><button class="btn primary" data-cmpitch ${S.slots<1?'disabled':''}>Make the deal</button></div></div>`);
}
function cmPitch(){
  const m=cm(NEGO.m);const before=snap();S.slots--;stress(3);
  const o=cmOffers(m).find(x=>x.id===NEGO.offer);let out;
  if(chance(cmOdds())){
    crel(m,6+Math.max(0,o.v)*20);
    if(o.id==='pet'){S.pend.pets[m.id]=true;const due=S.budgetSession&&!S.budgetSubmitted?S.q:Math.min(16,S.q+(4-(S.q-1)%4));S.commitments.push({m:m.id,due})}
    if(o.id==='townhall'){mood(m.bloc,2);stress(3)}
    if(o.id==='board'){integ(-2);expo(5)}
    if(o.id==='cosponsor')S.council.forEach(x=>{if(x.bloc!==m.bloc)crel(x,-3)});
    const a=NEGO.ask;
    if(a==='vote')m.voteP=true;
    if(a==='endorse')m.endorse=true;
    if(a==='back')mood(m.bloc,2);
    out=`${m.name} shakes on it${a==='vote'?' and will vote for your next budget':a==='endorse'?' and will endorse you':a==='back'?' and will talk you up in '+m.district:''}.`;
    if(o.id==='pet')out+=` The ${m.pet.name} is now in your pending budget. Pass it ${S.budgetSession&&!S.budgetSubmitted?'this quarter':S.q>=13?'with a budget amendment before Election Day':'by the end of the next budget session'} or pay for breaking your word.`;
  }else{crel(m,-2);out=`${m.name} hears you out and says no.`}
  save();render();showOutcome('Council office',m.name,out,before);
}
function submitBudget(){
  if(!pendChanged()){toast('Nothing has changed yet.');return}
  const cost=S.budgetSession&&!S.budgetSubmitted?0:1;
  if(S.slots<cost){toast('Mid-year amendments need a free agenda slot.');return}
  if(S.flags.noRouteCuts&&S.programs.nightbus&&!S.pend.programs.nightbus){toast('You promised Local 310 no route cuts. The night bus stays.');return}
  S.slots-=cost;const before=snap();
  const v=councilVote();const seats=v.seats;
  const roll=v.members.map(x=>({m:x.m,yes:x.m.voteP||x.s+rnd(-.08,.08)>.5}));
  const yes=roll.filter(x=>x.yes).length;const pass=yes>seats/2;
  S.council.forEach(m=>m.voteP=false);
  let out;
  if(pass){
    const p=S.pend;
    DEPTS.forEach(d=>{const x=p.budget[d.id]-S.budget[d.id];if(!x)return;for(const f in S.rel)if(FACTIONS[f].dept===d.id)rel(f,clamp(x*.5,-15,15))});
    const hike=Math.max(0,p.tax.prop-S.tax.prop)/.1+Math.max(0,p.tax.sales-S.tax.sales)/.25+Math.max(0,p.tax.fees-S.tax.fees)/.1;
    const cutT=Math.max(0,S.tax.prop-p.tax.prop)/.1+Math.max(0,S.tax.sales-p.tax.sales)/.25+Math.max(0,S.tax.fees-p.tax.fees)/.1;
    for(const f in S.rel)if(FACTIONS[f].taxLow)rel(f,(cutT-hike)*3);
    if(p.tax.prop>S.startTax.prop+1e-9||p.tax.sales>S.startTax.sales+1e-9){if(!S.raisedTax&&S.promises.includes('notax'))news('“No new taxes” pledge broken.','bad');S.raisedTax=true}
    PROGRAMS.forEach(pr=>{const was=S.programs[pr.id],now=p.programs[pr.id];
      if(was&&!now){if(pr.fan)rel(pr.fan,-10);if(pr.hater)rel(pr.hater,6);if(pr.fanBloc)mood(pr.fanBloc,pr.low?-1:-3);if(pr.low){S.cutsLow++;if(S.audited)integ(2)}}
      if(!was&&now){if(pr.fan)rel(pr.fan,6);if(pr.low)S.cutsLow=Math.max(0,S.cutsLow-1)}
      if(was&&!now&&pr.councilFan)rel('council',-2)});
    S.council.forEach(m=>{const was=!!S.pets[m.id],now=!!p.pets[m.id];
      if(!was&&now){crel(m,20);mood(m.bloc,1)}
      if(was&&!now){crel(m,-25);mood(m.bloc,-1)}});
    S.budget={...p.budget};S.tax={...p.tax};S.programs={...p.programs};S.pets={...p.pets};
    if(S.budgetSession)S.budgetSubmitted=true;
    roll.forEach(x=>crel(x.m,x.yes?2:-1));
    news(`Council adopts ${S.budgetSession&&cost===0?'the FY'+year(S.q)+' budget':'a budget amendment'}, ${yes}–${seats-yes}.`,'good');
    out=`The council votes ${yes}–${seats-yes} to adopt it. New funding levels take effect immediately.`;
  }else{roll.forEach(x=>{if(!x.yes)crel(x.m,-2)});news(`Council rejects the mayor’s budget, ${yes}–${seats-yes}.`,'bad');
    out=`The council votes it down ${yes}–${seats-yes}. Meet the undecided members, fund a district project or two, or make smaller changes. ${S.budgetSession&&!S.budgetSubmitted?'You can revise and resubmit this quarter at no cost.':''}`}
  save();render();
  openModal(`${memoHead('Council chamber')}<div class="memo-body"><h2 id="mtitle">${pass?'Budget adopted':'Budget rejected'}</h2>
    <p class="outcome">${esc(out)}</p>${rollCall(roll.map(x=>({m:x.m,label:x.yes?'Yes':'No',cls:x.yes?'good':'bad'})))}<div class="deltas">${diffChips(before)}</div>
    <div class="foot"><button class="btn primary" data-close>Back to the desk</button></div></div>`);
}

/* ============ reports & endings ============ */
function showReport(r){
  const row=(k,v,cls='')=>`<span class="${cls}">${k}</span><span class="v ${cls}">${v}</span>`;
  const blocs=['L','C','R'].map(b=>{const d=r.after.blocs[b]-r.before.blocs[b];return row(`${BLOCS[b].name} voters`,`${r.after.blocs[b].toFixed(0)}% <span class="${d>=0?'':'muted'}">(${sgn(d)})</span>`)}).join('');
  const depts=DEPTS.map(d=>{const x=r.after.q[d.id]-r.before.q[d.id];return Math.abs(x)>=1?`<span class="delta ${x>0?'up':'down'}">${d.name} ${sgn(x)}</span>`:''}).join('');
  openModal(`<div class="memo-head"><span>Quarterly report · ${when(r.q)}</span><span>Office of Finance</span></div><div class="memo-body">
   <h2 id="mtitle">${r.net>=0?'In the black':'In the red'} this quarter</h2>
   <div class="ledger">${row('Revenue',money(r.rev.total/4))}${row('Spending',money(-r.sp.total/4))}${row('Net',money(r.net),'tot')}${row('City reserve',money(r.after.treasury))}${row('Economy index',r.after.econ.toFixed(3))}</div>
   <div class="ledger">${row('Overall approval',r.after.appr.toFixed(0)+'% ('+sgn(r.after.appr-r.before.appr)+')','tot')}${blocs}</div>
   ${depts?`<div class="section"><div class="eyebrow">Service ratings</div><div class="deltas">${depts}</div></div>`:''}
   <div class="foot"><button class="btn primary" data-afterreport>${S.over?'Continue':S.q>16?'Go to Election Night':'Begin '+when(S.q)}</button></div></div>`);
}
function showEnding(kind){
  const T={bankrupt:['State takeover','The reserve fell so far into debt that the state appointed an emergency manager. You keep the title and lose the power.'],
    recall:['Recalled','Two straight quarters below 25% approval gave your opponents the signatures they needed. The recall passed easily.'],

  clearSave();
  openModal(`<div class="memo-head"><span>Final edition</span><span>${when(Math.min(S.q,16))}</span></div><div class="memo-body"><div class="result-big" id="mtitle">${T[0]}</div><p class="lede">${T[1]}</p>

function showElection(){
  if(!S.opp)makeOpp();
  const r=electionFactors(+rnd(-1.5,1.5).toFixed(1));const win=r.share>50;
  clearSave();

  <p class="lede">${esc(S.mayor)} ${r.share.toFixed(1)}% · ${esc(S.opp.name)} ${(100-r.share).toFixed(1)}%. ${win?'Four more years. The binder for the second term is even thicker.':'You call '+esc(S.opp.name)+' to concede a little after 11 p.m.'} You kept ${kept} of ${S.promises.length} promises.</p>
  <div class="ledger">${r.f.map(x=>`<span>${esc(x[0])}</span><span class="v" style="color:${x[1]>=0?'var(--good)':'var(--bad)'}">${sgn(x[1],1)} pts</span>`).join('')}<span class="tot">Starting from 50%</span><span class="v tot">${r.share.toFixed(1)}%</span></div>
  ${r.ends.length?`<p class="muted">Endorsed by: ${esc(r.ends.join(', '))}.</p>`:''}
  <div class="foot"><button class="btn primary" data-restart>Start a new term</button></div></div>`);

function initials(s){return s.split(/\s+/).filter(Boolean).map(w=>Array.from(w)[0]).slice(0,3).join('').toUpperCase()}
function actRow(t,h,btns){return `<div class="act"><div><div class="t">${t}</div><div class="h">${h}</div></div><div class="btns">${btns}</div></div>`}
function abtn(id,label,arg='',dis=false,cost){const c=cost??ACTIONS[id].cost;return `<button class="btn small" data-act="${id}" data-arg="${arg}" ${dis||S.slots<c?'disabled':''}>${label} · ${c} slot${c>1?'s':''}</button>`}
function spark(){

/* ============ events wiring ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(!S||d.start!==undefined||d.resume!==undefined||d.size||d.lean!==undefined||d.fac||d.prom){
    if(d.size){SETUP.size=d.size;render()}
    else if(d.lean!==undefined&&!S){SETUP.lean=+d.lean;render()}
    else if(d.fac){const a=SETUP.factions;const i=a.indexOf(d.fac);if(i>=0)a.splice(i,1);else if(a.length<6)a.push(d.fac);else toast('Six players is the limit.');render()}
    else if(d.prom){const a=SETUP.promises;const i=a.indexOf(d.prom);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(d.prom);else toast('Three promises. Deselect one first.');render()}
    else if(d.start!==undefined){newGame(SETUP)}
    else if(d.resume!==undefined){S=loadSave();if(S){render();if(S.queue.length)nextEvent()}}
    if(!S||d.start!==undefined||d.resume!==undefined)return;
  }
  if(d.tab){S.tab=d.tab;save();render();window.scrollTo({top:0})}
  else if(d.act){doAction(d.act,d.arg)}
  else if(d.choice!==undefined){resolveChoice(+d.choice)}
  else if(d.next!==undefined){nextEvent()}
  else if(d.close!==undefined){closeModal()}
  else if(d.nego){openNego(d.nego)}
  else if(d.cmnego){openCmNego(d.cmnego)}
  else if(d.cmask){NEGO.ask=d.cmask;renderCmNego()}
  else if(d.cmoffer){NEGO.offer=d.cmoffer;renderCmNego()}
  else if(d.cmpitch!==undefined){cmPitch()}
  else if(d.pet){S.pend.pets[d.pet]=!S.pend.pets[d.pet];if(!S.pend.pets[d.pet])delete S.pend.pets[d.pet];const y=window.scrollY;render();window.scrollTo({top:y})}
  else if(d.ask){NEGO.ask=d.ask;renderNego()}
  else if(d.offer){NEGO.offer=d.offer;renderNego()}
  else if(d.pitch!==undefined){pitch()}
  else if(d.endq!==undefined){if($('#modalWrap').hidden)endQuarter()}
  else if(d.afterreport!==undefined){closeModal();afterReport()}
  else if(d.restart!==undefined){closeModal();S=null;SETUP=defaultSetup();render();window.scrollTo({top:0})}
  else if(d.prog){S.pend.programs[d.prog]=!S.pend.programs[d.prog];const y=window.scrollY;render();window.scrollTo({top:y})}
  else if(d.submit!==undefined){submitBudget()}
  else if(d.resetbudget!==undefined){syncPend();const y=window.scrollY;render();window.scrollTo({top:y})}
});

    const out=t.parentElement.querySelector('.out');
    if(t.dataset.dept){const d=DEPTS.find(x=>x.id===t.dataset.dept);const v=S.pend.budget[d.id];out.innerHTML=`${v}%${v!==S.budget[d.id]?` <span class="chg">(was ${S.budget[d.id]}%)</span>`:''}<small>${money(d.base*v/100)}/yr</small>`;
      const sub=t.parentElement.querySelector('.sub');sub.textContent=`Rated ${S.svc[d.id].toFixed(0)} · target ${target(d.id,S.pend.budget,S.pend.programs,S.pend.pets).toFixed(0)}`}
    else{const k=t.dataset.tax,v=S.pend.tax[k];const f=k==='fees'?x=>Math.round(x*100)+'%':x=>x.toFixed(2)+'%';
      const rv={prop:x=>470*(x/1.1),sales:x=>290*(x/1.5)*(1-.12*Math.max(0,x-1.5)),fees:x=>110*x}[k];
      out.innerHTML=`${f(v)}${Math.abs(v-S.tax[k])>1e-9?` <span class="chg">(was ${f(S.tax[k])})</span>`:''}<small>${money(rv(v)*S.econ)}/yr</small>`}
    refreshBudgetSummary();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalWrap').hidden&&$('#modal [data-close]'))closeModal()});
// The Android app's back button asks the page first: close a dismissible dialog, then go back to City Hall.
// Returns false when there is nothing to step back from, so the app can close.
window.fsBack=()=>{
  if(!$('#modalWrap').hidden){if($('#modal [data-close]')){closeModal();return true}return true}
  if(S&&S.tab!=='hall'){S.tab='hall';save();render();window.scrollTo({top:0});return true}
  return false;
};

/* ============ boot ============ */
window.claude?.hot?.snapshot?.(()=>({S,SETUP}));
function start(data){
  SETUP=(data&&data.SETUP)||defaultSetup();
  S=(data&&data.S)?upgradeSave(data.S):null;
  render();
  if(S&&S.queue&&S.queue.length)nextEvent();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
