<style>
/* Layout: an office-terminal RPG — status column left, scene window center, transit map right; stacks to one column on phones */
:root {
  --bg: #d6dbd3;
  --panel: #f2f3ee;
  --panel-2: #e4e8e0;
  --ink: #1f2423;
  --muted: #59625e;
  --line: #a9b0a9;
  --accent: #ecd040;
  --accent-ink: #1f2423;
  --good: #3a7a55;
  --warn: #a8701a;
  --bad: #b03838;
  --link: #2f6299;
  --shadow: #1f2423;
  --f-display: 'Silkscreen', 'Courier New', monospace;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141718; --panel: #1f2324; --panel-2: #282d2e; --ink: #dde2db; --muted: #97a09b;
    --line: #3c4342; --accent: #e2c545; --accent-ink: #141718; --good: #6cbf8b; --warn: #e3a74c;
    --bad: #e37070; --link: #86b2e0; --shadow: #000000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141718; --panel: #1f2324; --panel-2: #282d2e; --ink: #dde2db; --muted: #97a09b;
  --line: #3c4342; --accent: #e2c545; --accent-ink: #141718; --good: #6cbf8b; --warn: #e3a74c;
  --bad: #e37070; --link: #86b2e0; --shadow: #000000; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

.label { font-family: var(--f-display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 16px;
  background: var(--panel); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); }
.brand { font-family: var(--f-display); font-size: 18px; line-height: 1; }
.brand small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-top: 4px; }
.clock { font-family: var(--f-mono); font-size: 28px; font-weight: 600; line-height: 1; }
.hud-item { display: grid; gap: 2px; }
.hud-val { font-family: var(--f-mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.hud-spacer { flex: 1; }
.xpbar { width: 110px; height: 6px; background: var(--panel-2); border: 1px solid var(--line); }
.xpbar i { display: block; height: 100%; background: var(--link); }
.btn { border: 2px solid var(--ink); background: var(--panel); padding: 7px 14px; cursor: pointer;
  font-family: var(--f-display); font-size: 12px; box-shadow: 2px 2px 0 var(--shadow); }
.btn:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Timeline */
.timeline { position: relative; height: 34px; background: var(--panel); border: 2px solid var(--ink); }
.timeline .fill { position: absolute; inset: 0 auto 0 0; background: var(--panel-2); border-right: 2px solid var(--ink); }
.timeline .mark { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
.timeline .mark span { position: absolute; top: 3px; left: 4px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.timeline .mark.due span { color: var(--ink); }

/* Main grid */
.grid { display: grid; grid-template-columns: 270px minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.win { background: var(--panel); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); }
.win-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 12px; border-bottom: 2px solid var(--ink); background: var(--panel-2); }
.win-h h2 { margin: 0; font-family: var(--f-display); font-size: 13px; font-weight: 400; letter-spacing: .04em; }
.win-b { padding: 12px; display: grid; gap: 10px; }
.col { display: grid; gap: 14px; min-width: 0; }

/* Stat bars */
.stat { display: grid; gap: 3px; }
.stat-top { display: flex; justify-content: space-between; font-size: 13px; }
.stat-top b { font-weight: 600; }
.bar { height: 12px; border: 2px solid var(--ink); background: var(--panel-2); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--good); transition: width .35s ease; }
.bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--panel) calc(10% - 2px) 10%); }
.bar.warn i { background: var(--warn); }
.bar.bad i { background: var(--bad); }
.stat small { color: var(--muted); font-size: 12px; }

/* Quests */
.quests { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.quests li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.35; }
.qbox { width: 16px; height: 16px; border: 2px solid var(--ink); margin-top: 1px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; line-height: 1; }
.quests li.done .qbox { background: var(--good); border-color: var(--good); color: var(--panel); }
.quests li.failed .qbox { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.quests li.partial .qbox { background: var(--warn); border-color: var(--warn); color: var(--panel); }
.quests li.done .qt, .quests li.failed .qt, .quests li.void .qt { color: var(--muted); }
.quests li.void .qbox { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.pick { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; padding: 7px 9px; border: 2px solid var(--line); cursor: pointer; font-size: 13.5px; line-height: 1.35; }
.pick:has(input:checked) { border-color: var(--ink); background: var(--panel-2); }
.pick input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--ink); }
.pick small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.receipt div span:last-child { text-align: right; }
.quests li.failed .qt { text-decoration: line-through; }
.quests small { display: block; color: var(--muted); font-size: 12px; }

/* Bag & skills */
.items { display: grid; gap: 6px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
.item .use { font-family: var(--f-display); font-size: 10px; padding: 3px 8px; border: 1.5px solid var(--ink); background: var(--panel); cursor: pointer; box-shadow: 1.5px 1.5px 0 var(--shadow); }
.item .use:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.item .use:disabled { opacity: .4; cursor: not-allowed; }
.empty { color: var(--muted); font-size: 13px; font-style: italic; }
.skills { display: grid; gap: 4px; font-size: 13px; }
.skills div { display: flex; justify-content: space-between; gap: 8px; }
.skills .locked { color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* Scene */
.scene-title { margin: 0; font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 24px); font-weight: 400; line-height: 1.15; text-wrap: balance; }
.scene-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.scene-desc { margin: 0; max-width: 62ch; }
.chip { display: inline-block; padding: 1px 7px; border: 1.5px solid currentColor; font-family: var(--f-mono); font-size: 11px; line-height: 1.5; }
.chip.open { color: var(--good); }
.chip.closed { color: var(--bad); }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.act { text-align: left; padding: 9px 11px; border: 2px solid var(--ink); background: var(--panel); cursor: pointer; display: grid; gap: 2px; box-shadow: 2px 2px 0 var(--shadow); min-height: 54px; }
.act b { font-weight: 600; font-size: 14px; }
.act span { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.act:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.act:hover:not(:disabled) span { color: var(--accent-ink); }
.act:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
.act:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; border-style: dashed; }
.act.key { border-width: 3px; }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; max-height: 300px; overflow-y: auto; font-size: 14px; }
.log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding-bottom: 7px; border-bottom: 1px dashed var(--line); }
.log li:last-child { border-bottom: 0; }
.log time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.log li.good p { color: var(--good); }
.log li.bad p { color: var(--bad); }
.log li.note p { font-weight: 500; }
.log li:first-child p { font-weight: 500; }
.log p { margin: 0; }

/* Map */
.district { border: 2px solid var(--ink); background: var(--panel-2); padding: 8px; display: grid; gap: 6px; }
.district h3 { margin: 0; font-family: var(--f-display); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .05em; }
.node { text-align: left; border: 2px solid var(--ink); background: var(--panel); padding: 7px 9px; cursor: pointer; display: grid; gap: 1px; }
.node b { font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.node span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.node:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.node:hover:not(:disabled) span { color: var(--accent-ink); }
.node.here { background: var(--ink); color: var(--panel); cursor: default; }
.node.here span { color: var(--panel); opacity: .8; }
.youare { font-family: var(--f-display); font-size: 10px; background: var(--accent); color: var(--accent-ink); padding: 0 5px; }

.me { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.battle-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }

@keyframes bump { 0% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } 100% { transform: translateX(0) } }

const EVENT_IDS = Object.keys(EVENTS).filter(id => !EVENTS[id].internal);

function rollEvents(chosen) {
  let ids = chosen;
  if (!ids) {
    ids = [];
    const pool = EVENT_IDS.filter(id => id !== 'drunk').sort(() => Math.random() - 0.5);
    const n = rand(4, 6);
    for (const id of pool) {
      if (ids.length >= n) break;
      if (EXCLUSIVE.some(p => p.includes(id) && p.some(o => o !== id && ids.includes(o)))) continue;
      ids.push(id);
    }
    if (ids.includes('mixer') && Math.random() < 0.6) ids.push('drunk');
  }
  if (ids.includes('drunk') && !ids.includes('mixer')) ids.push('mixer');
  return ids.map(id => {
    const d = EVENTS[id];
    const at = d.at ?? (d.win ? rand(d.win[0], d.win[1] - 60) : 0);
    return { id, at, until: d.win ? d.win[1] : 0, done: !d.win };
  });
}

function markSeen(id) {
  if (EVENTS[id].internal) return;
  if (!S.f.events.includes(id)) S.f.events.push(id);

function checkEvents() {
  if (busy() || !S.started) return;
  for (const e of S.ev) {
    if (e.done) continue;
    const d = EVENTS[e.id];
    if (S.t < e.at) continue;
    if (S.t > e.until || (S.f.quit && (d.work || d.office || e.id === 'mixer'))) { e.done = true; continue; }
    if (d.work && !atWork()) continue;
    if (d.office && S.loc !== 'office') continue;
    if (d.cond && !d.cond()) continue;
    e.done = true;
    markSeen(e.id);

  }
}

/* ---------- Clock ---------- */
function advance(mins, interruptible = false) {
  let spent = 0;
  for (let i = 0; i < mins; i++) {
    if (S.t >= DAY_END) break;
    S.t++; spent++;
    S.st.energy = clamp(S.st.energy - (S.f.sick ? 0.075 : 0.05));
    S.st.fullness = clamp(S.st.fullness - 0.09);
    S.st.bladder = clamp(S.st.bladder + 0.11);
    if (S.st.fullness < 15 || S.st.energy < 10) S.st.mood = clamp(S.st.mood - 0.04);
    if (S.f.anxious) S.st.mood = clamp(S.st.mood - 0.015);
    const clock = clockEvents();
    const stop = clock || thresholds();
    if (S.t >= DAY_END) { if (!P.end) { P.end = true; queue(() => endDay('midnight')); } break; }
    if (clock === 'hard' || (stop && interruptible)) break;
  }
  return spent;
}

function clockEvents() {
  const t = S.t;
  if (t === 541 && !S.f.arrived && S.q.work === 'active') {
    S.q.work = 'failed';
    if (!S.f.excused) log('You are not at your desk. Gary has noticed.', 'bad');

  if (t === 630 && S.q.mom === 'hidden') { queue(momReminder); return true; }
  if (t === 900 && S.q.meeting === 'active') {
    if (atWork() && !S.f.quit) { queue(startMeeting); return 'hard'; }
    S.q.meeting = 'failed';
    log('The 3:00 meeting starts without you. Your name is said out loud, once.', 'bad');

  if (t === 1020 && !S.f.printed && S.q.report === 'active') {
    S.q.report = 'failed';
    log('Gary emails: "No worries on the report, first thing tomorrow is fine." It is not fine.', 'bad');

  if (t === 1080 && S.q.forecast === 'active') {
    S.q.forecast = 'failed';
    log('The VP asks where the Q4 forecast is. Gary forwards her email to you with no comment.', 'bad');
  }
  if (t === 1260 && S.q.mom === 'active') log('Mom usually goes to bed around now.', 'bad');
  return false;
}

function thresholds() {
  if (S.st.bladder >= 100 && !P.bladder) { P.bladder = true; queue(bladderEmergency); return true; }
  if (S.st.energy <= 0 && !P.energy) { P.energy = true; queue(collapse); return true; }
  if (S.st.mood <= 0 && !P.mood && !B) { P.mood = true; queue(breakdown); return true; }
  if (S.st.fullness <= 0 && S.t % 60 === 0) { mod('mood', -6); log('You are very hungry. It is affecting your personality.', 'bad'); }
  return false;
}

/* ---------- Travel ---------- */
function travel(dest) {
  if (busy() || dest === S.loc) return;
  if (S.loc === 'apartment' && !S.f.metLinda) {
    S.f.metLinda = true;
    const cont = () => travel(dest);
    log('You open your door. Linda from 4B is in the hallway.');
    startBattle('linda', { win: cont, lose: cont, flee: cont });
    render();
    return;
  }
  const same = LOCS[S.loc].zone === LOCS[dest].zone;
  if (same) { perform(() => go(dest, 6, 'walk')); return; }
  const to = LOCS[dest];
  showModal({
    title: `Go to ${to.short}`, body: `<p>${to.name} is ${to.zone === 'downtown' ? 'downtown' : 'back in your neighborhood'}. How are you getting there?</p>`,
    choices: [
      { label: 'Take the 12 bus', sub: `$2.75 · about 28 min · usually`, disabled: S.money < 2.75, run: () => { spend(2.75); go(dest, 28, 'bus'); } },
      { label: 'Walk', sub: 'Free · 70 min · Energy −10', run: () => go(dest, 70, 'walk') },
      { label: 'Get a rideshare', sub: '$18.40 · 16 min', disabled: S.money < 18.40, run: () => { spend(18.40); go(dest, 16, 'car'); } },
      { label: 'Never mind', sub: 'Stay here' },
    ],
  });
}

function go(dest, mins, mode) {
  const from = S.loc;
  S.loc = 'transit';
  if (mode === 'bus' && Math.random() < 0.3) { mins += rand(6, 14); log('The bus is late. The app said 2 min for 9 min.'); }
  advance(mins);
  if (mode === 'walk' && mins > 30) { mod('energy', -10); mod('mood', 2); }
  if (mode === 'bus' && !S.f.metCrypto && Math.random() < 0.45) {
    S.f.metCrypto = true;
    log('A man sits next to you on the bus. There are many empty seats.');
    startBattle('crypto', { win: () => arrive(dest), lose: () => arrive(dest), flee: () => { advance(4); log('You move to another seat. He waves.'); arrive(dest); } });
    return;
  }
  arrive(dest);
}

function arrive(dest) {
  S.loc = dest;
  const L = LOCS[dest];
  log(`You arrive at ${L.name}.${isOpen(dest) ? '' : ' It\'s closed.'}`);
  if (dest === 'office' && S.f.quit) log(S.f.quit === 'rage' ? 'You stand outside the building for a minute. Not today.' : 'You don\'t work here anymore. The lobby looks smaller already.');
  if (dest === 'office' && !S.f.arrived && S.t < DAY_END && !S.f.quit) {
    S.f.arrived = true;
    if (S.f.sick) log('You cough once. Three people roll their chairs away.', 'bad');
    if (S.f.wfh) {
      log('Gary looks up. "Weren\'t you working from home?" You say you\'re feeling better. You are not.');
    } else if (S.f.excused) {
      S.q.work = 'partial'; mod('mood', -4);
      log(EXCUSES[S.f.lie].arrive, 'bad');
    } else if (S.t <= 540) {
      S.q.work = 'done'; gainXP(10);
      log('You badge in. Nobody notices, which is the goal.', 'good');
    } else {
      S.q.work = 'partial';
      log('You\'re late. You try to get to your desk quietly.', 'bad');
      startBattle('gary', {});
    }
  }
}

/* ---------- Actions ---------- */
const act = (label, sub, run, disabled = false, key = false) => ({ label, sub, run, disabled, key });

function restroom(mins = 4) {
  advance(mins);
  S.st.bladder = 0;
  log('You use the restroom. Bladder reset.');
}

function workFactor() {
  let f = 1;
  if (S.st.energy < 20) f *= 0.6;
  if (S.st.mood < 20) f *= 0.75;
  if (hungry()) f *= 0.8;
  return f;
}
const workRate = () => Math.round((22 + 4 * (S.lvl - 1)) * workFactor());
const forecastRate = () => Math.round(28 * workFactor());

const TASKS = ['the tracker migration', 'the budget macro', 'the SFTP connection'];
function attemptTask() {
  const spent = advance(45, true);
  S.f.workMin += spent; mod('energy', -6); mod('mood', -3);
  const chance = 0.3 + 0.1 * (S.lvl - 1) + (S.f.priyaTip ? 0.2 : 0);
  if (spent >= 40 && Math.random() < chance) {
    const name = TASKS[S.f.tasksDone++];
    gainXP(10);
    log(`You figured out ${name}. You're not sure how. Don't touch it.`, 'good');
    if (S.f.tasksDone >= 3) { S.q.tasks = 'done'; log('All three delegated tasks are done. They are yours forever now.', 'good'); }
  } else {
    log(pick(['You watch a YouTube tutorial. It\'s for a different version.',
      'You find a forum post from 2014 with your exact problem. The only reply says "nvm fixed it."',
      'You break something else. You fix that instead.',
      'You read the documentation. The documentation is one slide.']) + ` (${S.f.tasksDone} of 3 done)`);
  }
}
function workForecast() {
  const spent = advance(60, true);
  S.f.workMin += spent;
  S.f.forecast = Math.min(100, S.f.forecast + forecastRate() * spent / 60);
  mod('energy', -9 * spent / 60); mod('mood', -6 * spent / 60); gainXP(Math.round(7 * spent / 60));
  log(`You work on the Q4 forecast. You google "how to build a revenue forecast." Forecast: ${Math.floor(S.f.forecast)}%.`);
  if (S.f.forecast >= 100) { S.q.forecast = 'done'; gainXP(12); log('You send the VP the Q4 forecast. Gary replies-all: "Great work, team."', 'good'); }
}

// The desk work you can do at the office, or at home when working from home.
function workActions() {
  const a = [];
  const done = S.f.report >= 100;
  a.push(act('Work on the Q3 report', done ? 'The report is written' : `60 min · Energy −8 · Report +${workRate()}%`, () => work(60), done, !done));
  a.push(act('Work for 30 minutes', done ? 'The report is written' : `30 min · Report +${Math.round(workRate() / 2)}%`, () => work(30), done));
  if (S.loc === 'office') {
    a.push(act('Print the report', S.f.printed ? 'Already printed' : done ? 'Encounter · the printer' : 'Finish writing it first', printReport, !done || S.f.printed, done && !S.f.printed));
  } else {
    a.push(act('Email the report to Gary', S.f.printed ? 'Already sent' : done ? '5 min' : 'Finish writing it first', () => {
      advance(5);
      log('The attachment bounces for being too big. You zip it. It goes through.');
      reportIn();
    }, !done || S.f.printed, done && !S.f.printed));
  }
  if (S.q.tasks === 'active') a.push(act('Attempt a delegated task', `45 min · ${S.f.tasksDone} of 3 done · no idea how`, attemptTask, false, true));
  if (S.q.forecast === 'active') a.push(act('Work on the Q4 forecast', `60 min · Forecast +${forecastRate()}%`, workForecast, false, true));
  a.push(act('Deal with your inbox', S.f.inbox ? 'Done for today' : 'Encounter · 214 unread', () => {
    startBattle('inbox', { win: () => { S.f.inbox = true; }, lose: () => { S.f.inbox = true; }, flee: () => log('You close the tab. The emails remain.') });
  }, !!S.f.inbox));
  return a;
}

function work(mins) {
  if (S.t >= 600 && !S.f.dale && S.loc === 'office') {
    S.f.dale = true;
    log('You open the report. Dale appears at the edge of your cubicle.');
    startBattle('dale', {});
    return;
  }
  const rate = workRate();
  const spent = advance(mins, true);
  S.f.workMin += spent;
  const gain = rate * spent / 60;
  S.f.report = Math.min(100, S.f.report + gain);
  mod('energy', -8 * spent / 60); mod('mood', -5 * spent / 60);
  gainXP(Math.round(6 * spent / 60));
  log(spent < mins
    ? `You work for ${spent} minute${spent === 1 ? '' : 's'} before you're interrupted. Report: ${Math.floor(S.f.report)}%.`
    : `You work on the report for ${spent} minutes. ${pick(['You make a pivot table.', 'You rename a column, then rename it back.', 'You write "Key Takeaways" and then sit there.', 'You find a number that is wrong. It was always wrong.'])} Report: ${Math.floor(S.f.report)}%.`);
  if (S.f.report >= 100) log('The report is written. Now it needs to be printed.', 'good');
}

function printReport() {
  startBattle('printer', {
    win: () => reportIn(),
    lose: () => { reportIn(); mod('mood', -5); },
    flee: () => log('You walk away from the printer. The report remains unprinted.'),
  });
}
function reportIn() {
  S.f.printed = true;
  S.q.report = S.t <= 1020 ? 'done' : 'partial';
  gainXP(10);
  const where = S.loc === 'office' ? 'on Gary\'s chair' : 'in Gary\'s inbox';
  log(S.t <= 1020 ? `The Q3 report is ${where}, on time.` : `The Q3 report is ${where}. Late, but there.`, S.t <= 1020 ? 'good' : '');
  if (S.f.jealous) { mod('mood', -4); log('Gary sends the report back within a minute: "Can we do Calibri?"', 'bad'); }
}

function buy(item, price, mins = 3, msg) {
  if (!spend(price)) { log('You don\'t have enough money for that.', 'bad'); return false; }
  advance(mins); give(item);
  log(msg || `You buy ${ITEMS[item].name.toLowerCase()} for ${money(price)}.`);
  return true;
}

function giftScore() {
  const card = S.inv.card_nice ? 2 : S.inv.card_generic ? 1 : 0;
  const gift = S.inv.candle ? 2 : S.inv.flowers ? 2 : 0;
  return card + gift;
}

function callMom() {
  const onTime = S.t < 1260;
  advance(20); S.f.phoneMin += 20;
  const g = giftScore();
  const gifts = [S.inv.candle && 'a candle', S.inv.flowers && 'flowers', S.inv.card_nice ? 'a nice card' : S.inv.card_generic && 'a card'].filter(Boolean);
  let body;
  if (!onTime) {
    S.q.mom = 'partial'; mod('mood', 2); gainXP(5);
    body = `<p>It goes to voicemail. You say happy birthday${gifts.length ? ` and that you got her ${gifts.join(' and ')}` : ''}. You say "love you" and hang up a little too fast.</p>`;
  } else {
    S.q.mom = 'done'; gainXP(15);
    if (g >= 3) { mod('mood', 15); body = `<p>She picks up on the second ring. You tell her you got her ${gifts.join(' and ')}. She says that\'s too much, which means it\'s the right amount.</p><p>She asks if you\'re eating enough. You say yes.</p>`; }
    else if (g >= 1) { mod('mood', 11); body = `<p>You tell her you got her ${gifts.join(' and ')}. She says that\'s sweet. She tells you about her day, which included a long story about the pharmacy.</p>`; }
    else { mod('mood', 6); body = '<p>She says she wasn\'t expecting anything. She mentions that your sister sent flowers.</p><p>She asks if you\'re eating enough. You say yes.</p>'; }
  }
  if (onTime && S.f.lie === 'grandma') body += '<p>She mentions that Grandma called this morning to say happy birthday. You say "great!" a little too loudly.</p>';
  if (onTime && S.f.lotto) body += S.f.lotto === 'told'
    ? '<p>She asks about the lottery. Your cousin already told her. She would like to discuss the roof.</p>'
    : '<p>You almost tell her about the lottery ticket. You decide to tell her in person.</p>';
  log(onTime ? 'You called Mom. Twenty minutes.' : 'You left Mom a voicemail.', onTime ? 'good' : '');
  showModal({ title: onTime ? 'You Call Mom' : 'Voicemail', body, choices: [{ label: 'Hang up' }] });
}

function useItem(id) {
  const it = ITEMS[id];
  if (!it || it.key || !S.inv[id]) return;
  if (B) {
    if (!it.battle || B.over) return;
    take(id);
    bline(it.use());
    enemyTurn();
    return;
  }
  if (busy()) return;
  if (it.where && !it.where.includes(S.loc)) { log(`You need a microwave for that. There's one at home and one at the office.`, 'bad'); render(); return; }
  perform(() => { take(id); advance(it.mins || 2); log(it.use()); });
}

/* ---------- Battle ---------- */
function startBattle(id, cb = {}) {
  const e = ENEMIES[id];
  B = { id, hp: e.hp, max: e.hp, stun: false, stareCd: 0, lines: [e.intro], over: null, cb, showItems: false };
  render();
}
function bline(s) { B.lines.push(s); B.lines = B.lines.slice(-6); }
function useSkill(i) {
  if (!B || B.over) return;
  const sk = SKILLS[i], e = ENEMIES[B.id];
  if (S.lvl < sk.lvl || S.st.energy < sk.cost) return;
  if (sk.stun && B.stareCd > 0) return;
  mod('energy', -sk.cost);
  let mult = 1, note = '';
  if (e.weak.includes(sk.tag)) { mult = 1.5; note = 'That landed.'; }
  else if (e.immune.includes(sk.tag)) { mult = 0.25; note = e.immuneText || 'It barely registers.'; }
  else if ((e.resist || []).includes(sk.tag)) { mult = 0.5; note = 'It only half works.'; }
  if (hungry()) mult *= 0.85;
  const d = Math.max(1, Math.round(rand(sk.dmg[0], sk.dmg[1]) * mult));
  if (e.healOn === sk.tag) {
    const h = Math.round(d / 2);
    B.hp = Math.min(B.max, B.hp + h);
    bline(`${sk.use} ${e.healText} (+${h})`);
  } else {
    B.hp = Math.max(0, B.hp - d);
    bline(`${sk.use} ${note} (−${d})`);
    B.hit = true;
  }
  if (sk.stun) {
    B.stareCd = 2;
    if (!e.noStun) B.stun = true; else bline('The printer stares back.');
  }
  if (B.hp <= 0) return winBattle();
  enemyTurn();
}
function enemyTurn() {
  const e = ENEMIES[B.id];
  if (B.stareCd > 0) B.stareCd--;
  if (B.stun) {
    B.stun = false;
    bline(`${e.name.split(',')[0]} loses their train of thought.`);
  } else {
    const m = pick(e.moves);
    let md = m.mood || 0;
    if (hungry()) md = Math.round(md * 1.25);
    mod('mood', -md);
    if (m.energy) mod('energy', -m.energy);
    bline(`${m.t}${md ? ` (Mood −${md}${m.energy ? `, Energy −${m.energy}` : ''})` : ''}`);
    if (m.time) advance(m.time);
    B.meHit = true;
  }
  advance(e.turn || 2);
  if (S.st.mood <= 0) return loseBattle();
  render();
}
function winBattle() {
  const e = ENEMIES[B.id];
  B.over = 'win'; S.f.won++;
  bline(e.win);
  bline(`+${e.xp} XP`);
  gainXP(e.xp);
  render();
}
function loseBattle() {
  const e = ENEMIES[B.id];
  B.over = 'lose'; S.f.lost++;
  S.st.mood = 8;
  bline(e.lose);
  bline(`You got through it. Mood is at 8. +${Math.round(e.xp / 3)} XP`);
  gainXP(Math.round(e.xp / 3));
  render();
}
function flee() {
  if (!B || B.over) return;
  const e = ENEMIES[B.id];
  if (e.noFlee) return;
  if (Math.random() < 0.55) {
    B.over = 'flee';
    bline('You say "Anyway!" and leave. It works.');
    render();
  } else {
    mod('mood', -3);
    bline('You say "Anyway!" It doesn\'t work. (Mood −3)');
    enemyTurn();
  }
}
function endBattle() {
  if (!B || !B.over) return;
  const { cb, over, id } = B;
  const e = ENEMIES[id];
  B = null;
  if (over === 'win') log(`${e.name}: ${e.win}`, 'good');
  else if (over === 'lose') log(`${e.name}: ${e.lose}`, 'bad');
  else log(`You got away from ${e.name}.`);
  const fn = cb[over];
  if (fn) fn();
  flush();
}

/* ---------- Ending ---------- */
const PTS = { done: 2, partial: 1, failed: 0, active: 0, hidden: 0, void: 0 };
const qTitle = k => typeof QUESTS[k].title === 'function' ? QUESTS[k].title() : QUESTS[k].title;
function endDay(reason) {
  if (S.over) return;
  if (reason === 'bed') S.q.bed = 'done';
  else S.q.bed = 'failed';
  if (S.q.tasks === 'active') S.q.tasks = S.f.tasksDone ? 'partial' : 'failed';
  if (S.q.forecast === 'active') S.q.forecast = 'failed';
  if (S.q.mom === 'active' || S.q.mom === 'hidden') S.q.mom = 'failed';
  if (S.q.dinner === 'active') S.q.dinner = 'failed';
  if (S.q.report === 'active') S.q.report = 'failed';
  if (S.q.meeting === 'active') S.q.meeting = 'failed';
  if (S.q.work === 'active') S.q.work = 'failed';
  S.over = true; S.f.endReason = reason;
  B = null; Q = []; modalOpen = false; $('modal').hidden = true;
  render(); save();
  showEnding(reason);
}

// Each quest that counts is worth 2 (1 if half-done); quests made moot by an event don't count.
// Three bonus points: a gift for Mom, ending in a good mood, and doing two chores.
function scoreDay() {
  const counted = Object.values(S.q).filter(v => v !== 'hidden' && v !== 'void');
  let score = counted.reduce((a, v) => a + PTS[v], 0);
  if ((S.q.mom === 'done' || S.q.mom === 'partial') && giftScore() >= 2) score++;
  if (S.st.mood >= 50) score++;
  if (S.f.chores >= 2) score++;
  return { score, max: counted.length * 2 + 3 };
}

function eventLines() {
  const f = S.f, out = [];
  if (f.sick) out.push(f.wfh ? 'You worked from home, sick. Gary asked if you could "hop on video real quick" twice.' : 'You went in sick. Two people are going to get it.');
  if (f.lie) out.push({ grandma: 'Your grandmother is alive and well. The sympathy card is in your bag. You will have to keep this going for a while.',
    mugged: 'HR emailed asking for a police report number "for our records."', hospital: 'Gary wants a doctor\'s note by Friday. You do not have a doctor.' }[f.lie]);
  if (f.envied) out.push('Being praised in front of everyone cost you a lunch invite and some goodwill. It did not come with money.');
  if (f.jealous) out.push('Gary feels threatened by you now. That will be a problem for the rest of your time here.');
  if (f.raise) out.push({ soon: 'The raise is "in the pipeline." It has been in the pipeline since June.',
    tight: 'There is no raise. Gary\'s new watch is very nice.', skipped: 'You didn\'t ask about the raise. Maybe Thursday.' }[f.raise]);
  if (f.anxious) out.push('The layoffs are still "maybe." You\'ll find out the way everyone does: a 15-minute meeting with HR on a Friday.');
  if (f.dei) out.push({ went: 'You went to your Belonging Breakout. You filled out the survey about it.',
    asked: 'HR is "taking the feedback back to the team." The team is Denise.', skipped: 'You skipped the Belonging Breakout. The 41-slide deck is still unread.' }[f.dei]);
  if (f.marcy) out.push(f.marcy === 'helped' ? 'You helped Marcy. She brought you a coffee on Wednesday.' : 'You stayed out of Marcy\'s situation. Dale got the thank-you card.');
  if (f.snapped) out.push('You told your coworkers you were "FINE." They will be careful around you for about a week.');
  if (f.vented) out.push('You admitted you weren\'t okay. Nothing bad happened.');
  if (f.mixer) out.push(f.mixer === 'went' ? 'You went to the mixer and talked to the same people you talk to every day, only louder.' : 'You skipped the mixer. Someone noticed. Gary.');
  if (f.drunkDale) out.push(f.drunkDale === 'listened' ? 'You know a lot about Dale\'s divorce now. He knows you know. Neither of you will ever mention it.' : 'You escaped Dale at the mixer. He cried to the bartender instead.');
  if (f.lotto) out.push({ quiet: 'You have $98 million and nobody knows. Tomorrow you call a lawyer. Tonight you set your alarm for 6:30 anyway.',
    told: 'Everyone knows you won the lottery. You have 41 new friends, and Dale has sent you a Venmo request.',
    quit: 'You quit your job because you have $98 million. You will never see the printer again.' }[f.lotto]);
  if (f.quit === 'rage') out.push('Wednesday, 8:58 AM. You badge in. It still works. The stapler is back on your desk. Gary says "Morning." You say "Morning." Nobody mentions it, then or ever.');
  return out;
}

function showEnding(reason) {
  const { score, max } = scoreDay();
  const r = score / max;
  const tiers = [
    [0.85, 'A Good Day', 'Nothing about today will be remembered by anyone, including you. That\'s what a good Tuesday is.'],
    [0.6, 'A Fine Day', 'Some things got done. Some things got moved to tomorrow. Tomorrow is also a day.'],
    [0.33, 'A Day', 'It happened. You were there for most of it.'],
    [0, 'One of Those Days', 'You\'ll tell someone about today eventually. It\'ll be funnier then.'],
  ];
  const [, title, line] = tiers.find(t => r >= t[0]);
  const opener = reason === 'bed'
    ? `You get into bed at ${fmt(S.t)}. You check your phone one last time, which turns into twenty minutes.`
    : 'It\'s midnight. You fall asleep on the couch with the TV asking if you\'re still watching.';
  const epi = {
    work: { done: S.f.wfh ? 'You logged on from home by nine and stayed visibly green on Slack.' : 'You got to work on time. Nobody noticed. Perfect.',
      partial: S.f.excused ? 'You got to work late, with an excuse nobody can question.' : 'You got to work late. Gary "flagged" it.', failed: 'You never made it to the office. There will be an email about this.' },
    meeting: { done: 'You survived the 3 PM meeting with no action items.', partial: 'You survived the 3 PM meeting, with two action items.', failed: 'You missed the 3 PM meeting. Someone took notes. Nobody will read them.' },
    report: { done: 'The Q3 report was in Gary\'s hands by five.', partial: 'The Q3 report was late, but it exists.', failed: 'The Q3 report is still a file called "Q3_FINAL_v2_actualfinal.xlsx".' },
    tasks: { done: 'You figured out all three delegated tasks. They are your job now.', partial: `You figured out ${S.f.tasksDone} of the three delegated tasks. Nobody explained any of them.`, failed: 'You didn\'t crack any of the delegated tasks. Neither would Gary.' },
    forecast: { done: 'The VP got her Q4 forecast by six. Gary presented it.', failed: 'The Q4 forecast wasn\'t done by six. The VP noticed. So did Gary.' },
    dinner: { done: 'You cooked dinner. The salad will go bad on Friday.', partial: 'You ordered delivery. The groceries are a problem for tomorrow.', failed: 'Dinner was whatever was around. There wasn\'t much around.' },
    mom: { done: giftScore() >= 2 ? 'You called Mom and had something to tell her about. She told your aunt.' : 'You called Mom. She was glad you called.', partial: 'You left Mom a voicemail. She\'ll call back tomorrow and mention it.', failed: 'You didn\'t call Mom on her birthday. Your sister will bring it up at Thanksgiving.' },
    bed: { done: 'You were in bed before midnight.', partial: '', failed: 'You did not make it to bed.' },
  };
  const box = st => st === 'done' ? '✓' : st === 'partial' ? '~' : st === 'void' ? '–' : '×';
  const rows = Object.keys(QUESTS).filter(k => S.q[k] !== 'hidden').map(k => {
    const text = S.q[k] === 'void' ? `${qTitle(k)}: not your problem anymore.` : epi[k][S.q[k]] || '';
    return `<li class="${S.q[k]}"><span class="qbox">${box(S.q[k])}</span><span>${esc(text)}</span></li>`;
  }).join('');
  const extras = eventLines();
  const seen = seenSet();
  const todays = S.f.events.map(id => EVENTS[id].name);
  const el = $('screen');
  el.innerHTML = `<div class="win title-card" role="dialog" aria-modal="true" aria-labelledby="etitle">
    <div class="win-h"><h2>End of Day</h2><span class="label">Tuesday, Oct 20</span></div>
    <div class="win-b" style="gap:14px">
      <p style="margin:0">${esc(opener)}</p>
      <p class="ending-title" id="etitle">${title}</p>
      <p style="margin:0">${esc(line)}</p>
      <ul class="epi quests">${rows}</ul>
      ${extras.length ? `<div class="label">Also today</div><ul class="epi">${extras.map(x => `<li><span>·</span><span>${esc(x)}</span></li>`).join('')}</ul>` : ''}
      <div class="receipt">
        <div><span>Score</span><span>${score} / ${max}</span></div>
        <div><span>Today's events</span><span>${todays.length ? esc(todays.join(', ')) : 'None. A normal Tuesday.'}</span></div>
        <div><span>Events discovered</span><span>${EVENT_IDS.filter(id => seen.has(id)).length} / ${EVENT_IDS.length}</span></div>
        <div><span>Level reached</span><span>${S.lvl} · ${TITLES[S.lvl - 1]}</span></div>
        <div><span>Encounters won / endured</span><span>${S.f.won} / ${S.f.lost}</span></div>
        <div><span>Coffees</span><span>${S.f.coffees}</span></div>
        <div><span>Minutes on phone</span><span>${S.f.phoneMin}</span></div>
        <div><span>Chores done</span><span>${S.f.chores}</span></div>
        <div><span>Close calls</span><span>${S.f.incidents}</span></div>
        <div><span>Final mood</span><span>${Math.round(S.st.mood)}</span></div>
        <div class="tot"><span>Spent today</span><span>${money(S.spent)}</span></div>
        <div><span>Left in account</span><span>${money(S.money)}</span></div>
      </div>

function showPicker(hasSave) {
  const el = $('screen');
  const seen = seenSet();
  el.innerHTML = `<div class="win title-card" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <div class="win-h"><h2 id="ptitle">Choose Today's Events</h2><span class="label">${EVENT_IDS.filter(id => seen.has(id)).length} / ${EVENT_IDS.length} discovered</span></div>

      <div class="picker">${EVENT_IDS.map(id => `<label class="pick" for="ev-${id}"><input type="checkbox" id="ev-${id}" value="${id}"><span>${esc(EVENTS[id].name)}${seen.has(id) ? ' <span class="tag">· seen</span>' : ''}<small>${esc(EVENTS[id].blurb)}</small></span></label>`).join('')}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="pickGo">Start with these</button>
        <button class="btn" id="pickBack">Back</button>
      </div>
    </div></div>`;
  el.hidden = false;

    for (const pair of EXCLUSIVE) if (pair.includes(id)) pair.filter(o => o !== id).forEach(o => { box(o).checked = false; });
    if (id === 'drunk') box('mixer').checked = true;
  };
  $('pickGo').onclick = () => {
    const ids = EVENT_IDS.filter(id => box(id).checked);
    clearSave(); el.hidden = true; newGame(ids);
  };
  $('pickBack').onclick = () => S.over ? showEnding(S.f.endReason) : showTitle(hasSave);
  $('pickGo').focus();
}

/* ---------- Title & start ---------- */
function showTitle(hasSave) {
  const el = $('screen');
  el.innerHTML = `<div class="win title-card" role="dialog" aria-modal="true" aria-labelledby="ttitle">
    <div class="win-h"><h2>Tuesday, Again</h2><span class="label">An RPG about a normal day</span></div>
    <div class="win-b" style="gap:14px">
      <h1 id="ttitle">Tuesday,<br>Again</h1>
      <p class="sub">You are a data analyst at Meridian Data Solutions. It is Tuesday, October 20. Nothing special is supposed to happen.</p>
      <ul class="howto">
        <li>Keep <b>Energy</b>, <b>Fullness</b>, and <b>Mood</b> up, and <b>Bladder</b> down. Everything you do takes time.</li>
        <li>Finish the quests on the left before their deadlines. The day ends at midnight.</li>
        <li>Some people and machines will start an encounter. Use the right skill: nodding doesn't work on printers.</li>
        <li>Nothing ends the game early. Running out of something just makes the day worse.</li>
        <li>Every Tuesday rolls a few random events. There are ${EVENT_IDS.length} to find, and you've seen ${EVENT_IDS.filter(id => seenSet().has(id)).length}.</li>
      </ul>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${hasSave ? '<button class="btn" id="cont">Continue your day</button>' : ''}
        <button class="btn" id="start">${hasSave ? 'Start over' : 'Wake up'}</button>
        <button class="btn" id="pick">Choose the events</button>
      </div>
    </div></div>`;
  el.hidden = false;
  $('pick').onclick = () => showPicker(hasSave);
  if (hasSave) $('cont').onclick = () => { el.hidden = true; render(); };
  $('start').onclick = () => { clearSave(); el.hidden = true; newGame(); };
  ($('cont') || $('start')).focus();
}

function newGame(chosen) {
  S = fresh(); B = null; Q = []; P = {}; modalOpen = false;
  S.ev = rollEvents(chosen);
  render();
  if (hasEvent('sick')) sickMorning();
  else if (hasEvent('late')) lateMorning();
  else alarm();
}
function alarm() {
  const n = S.f.snoozes;
  showModal({ title: n ? 'The Alarm, Again' : 'Your Alarm Goes Off',
    body: n === 0 ? `<p>${fmt(S.t)}. Your phone is playing the default alarm sound, which you have come to hate.</p>`
      : n < 3 ? `<p>${fmt(S.t)}. It's back.</p>` : `<p>${fmt(S.t)}. You have snoozed ${n} times. This is a choice you're making.</p>`,
    choices: [
      { label: 'Get up', sub: 'Start the day', run: () => { S.started = true; log(n ? `You get up at ${fmt(S.t)}. You hit snooze ${n} time${n > 1 ? 's' : ''}.` : 'You get up on the first alarm. A personal best.', n ? '' : 'good'); if (!n) gainXP(5); } },
      { label: 'Snooze', sub: '9 min · Energy +4', run: () => { S.f.snoozes++; advance(9); mod('energy', 4); alarm(); } },
    ] });
}

/* ---------- Render ---------- */
function barClass(k, v) {
  const good = k === 'bladder' ? 100 - v : v;
  return good < 20 ? 'bad' : good < 40 ? 'warn' : '';
}
const STAT_INFO = {
  energy: { name: 'Energy', note: v => v < 20 ? 'Running on fumes. Work is slower.' : v < 40 ? 'Could use a coffee.' : 'Awake enough.' },
  fullness: { name: 'Fullness', note: v => v <= 10 ? 'Hungry. Encounters hurt more.' : v < 30 ? 'Getting hungry.' : 'Fed.' },
  mood: { name: 'Mood', note: v => v < 20 ? 'Fragile. This is your health in encounters.' : 'Your health in encounters.' },
  bladder: { name: 'Bladder', note: v => v > 80 ? 'Find a restroom soon.' : v > 60 ? 'You\'ll want a restroom.' : 'Fine.' },
};

function render() {
  const lvlNext = LEVELS[S.lvl] ?? null;
  const prev = LEVELS[S.lvl - 1];
  const pct = lvlNext ? (S.xp - prev) / (lvlNext - prev) * 100 : 100;
  const here = LOCS[S.loc];
  $('hud').innerHTML = `
    <div class="brand">Tuesday, Again<small>Tue, Oct 20 · ${here ? esc(here.short) : 'In transit'}</small></div>
    <div class="hud-item"><span class="label">Time</span><span class="clock">${fmt(S.t)}</span></div>
    <div class="hud-item"><span class="label">Account</span><span class="hud-val">${money(S.money)}</span></div>
    <div class="hud-item"><span class="label">Level ${S.lvl}</span><span class="xpbar" title="${S.xp} XP"><i style="width:${pct}%"></i></span><span class="mono" style="font-size:11px;color:var(--muted)">${S.xp}${lvlNext ? ' / ' + lvlNext : ''} XP</span></div>
    <div class="hud-spacer"></div>
    <button class="btn" id="phoneBtn" ${busy() ? 'disabled' : ''}>Phone${S.q.mom === 'active' ? ' •' : ''}</button>`;
  $('phoneBtn').onclick = openPhone;

  const span = DAY_END - DAY_START;
  const pos = t => ((t - DAY_START) / span * 100).toFixed(2) + '%';
  const marks = [[540, '9a', 'work', 1], [720, '12p', '', 0], [900, '3p', 'meeting', 1], [1020, '5p', 'report', 1], [1260, '9p', 'Mom', S.q.mom !== 'hidden' ? 1 : 0]];
  if (S.q.forecast !== 'hidden') marks.splice(4, 0, [1080, '6p', 'forecast', 1]);
  $('timeline').innerHTML = `<div class="fill" style="width:${pos(S.t)}"></div>` +
    marks.map(m => `<div class="mark ${m[3] ? 'due' : 'minor'}" style="left:${pos(m[0])}"><span>${m[1]}${m[2] ? `<em style="font-style:normal"> · ${m[2]}</em>` : ''}</span></div>`).join('');

  $('lvlname').textContent = TITLES[S.lvl - 1];
  $('stats').innerHTML = Object.keys(STAT_INFO).map(k => {
    const v = Math.round(S.st[k]);
    return `<div class="stat"><div class="stat-top"><b>${STAT_INFO[k].name}</b><span class="mono">${v}</span></div>
      <div class="bar ${barClass(k, v)}" role="meter" aria-label="${STAT_INFO[k].name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><i style="width:${v}%"></i></div>
      <small>${STAT_INFO[k].note(v)}</small></div>`;
  }).join('');

  $('quests').innerHTML = Object.keys(QUESTS).filter(k => S.q[k] !== 'hidden').map(k => {
    const st = S.q[k];
    const box = st === 'done' ? '✓' : st === 'failed' ? '×' : st === 'partial' ? '~' : st === 'void' ? '–' : '';
    return `<li class="${st}"><span class="qbox">${box}</span><span><span class="qt">${esc(qTitle(k))}</span>${st === 'active' ? `<small>${esc(QUESTS[k].hint())}</small>` : ''}</span></li>`;
  }).join('');

  const inv = Object.keys(S.inv);
  $('bag').innerHTML = inv.length ? inv.map(id => {
    const it = ITEMS[id];
    const canUse = !it.key && !busy() && (!it.where || it.where.includes(S.loc));
    return `<div class="item"><span>${esc(it.name)}${S.inv[id] > 1 ? ` ×${S.inv[id]}` : ''}<br><span class="tag">${esc(it.desc)}</span></span>${it.key ? '' : `<button class="use" data-item="${id}" ${canUse ? '' : 'disabled'}>Use</button>`}</div>`;
  }).join('') : '<p class="empty">Keys, wallet, phone. Nothing else.</p>';
  $('bag').querySelectorAll('[data-item]').forEach(b => b.onclick = () => useItem(b.dataset.item));

  $('skills').innerHTML = SKILLS.map(s => S.lvl >= s.lvl
    ? `<div><span>${s.name}</span><span class="tag">${s.tag} · ${s.cost ? s.cost + ' EN' : 'free'}</span></div>`
    : `<div class="locked"><span>???</span><span class="tag">Level ${s.lvl}</span></div>`).join('');

  renderScene();
  $('log').innerHTML = S.log.map(l => `<li class="${l.kind}"><time>${fmt(l.t)}</time><p>${esc(l.text)}</p></li>`).join('') || '<li><time></time><p class="empty">Nothing yet.</p></li>';
  renderMap();
  renderBattle();
}

function renderScene() {
  const L = LOCS[S.loc];
  const el = $('scene');
  if (!L) { el.innerHTML = '<div class="win-b"><p>In transit.</p></div>'; return; }
  const open = isOpen(S.loc);
  const acts = ACTIONS[S.loc]();
  const closedMsg = !open ? `<p class="scene-desc"><b>Closed.</b> Hours: ${L.hours}. You can still leave.</p>`
    : S.loc === 'office' && S.f.quit ? `<p class="scene-desc"><b>${S.f.quit === 'rage' ? 'You quit today. Loudly.' : 'You quit. You have $98 million.'}</b> There's nothing for you to do here${S.f.quit === 'rage' ? ' until tomorrow' : ''}.</p>` : '';
  el.innerHTML = `<div class="win-h"><h2>Location</h2><span class="label">${L.zone === 'home' ? 'Your neighborhood' : 'Downtown'}</span></div>
    <div class="win-b">
      <h1 class="scene-title">${esc(L.name)}</h1>
      <div class="scene-meta"><span class="chip ${open ? 'open' : 'closed'}">${open ? 'Open' : 'Closed'}</span><span>Hours: ${L.hours}</span></div>
      <p class="scene-desc">${esc(L.desc())}</p>
      ${closedMsg}
      <div class="actions">${acts.map((a, i) => `<button class="act${a.key ? ' key' : ''}" data-a="${i}" ${a.disabled || busy() ? 'disabled' : ''}><b>${esc(a.label)}</b><span>${esc(a.sub)}</span></button>`).join('')}</div>
    </div>`;
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => perform(acts[+b.dataset.a].run));
}

function renderMap() {
  const zone = (z, title) => `<div class="district"><h3>${title}</h3>${Object.entries(LOCS).filter(([, l]) => l.zone === z).map(([id, l]) => {
    const here = id === S.loc;
    const open = isOpen(id);
    const cross = LOCS[S.loc] && LOCS[S.loc].zone !== z;
    const sub = here ? 'You are here' : `${open ? 'Open' : 'Closed'} · ${l.hours} · ${cross ? 'bus ~28 min' : 'walk 6 min'}`;
    return `<button class="node${here ? ' here' : ''}" data-go="${id}" ${here || busy() ? 'disabled' : ''}><b>${esc(l.short)}${here ? '<span class="youare">YOU</span>' : ''}</b><span>${sub}</span></button>`;
  }).join('')}</div>`;
  $('map').innerHTML = zone('home', 'Elm Street · Your neighborhood') +
    `<div class="route"><div class="line"></div><span>Route 12 bus<br>$2.75 · ~28 min</span></div>` +
    zone('downtown', 'Downtown');
  $('map').querySelectorAll('[data-go]').forEach(b => b.onclick = () => travel(b.dataset.go));
}

function renderBattle() {
  const el = $('battle');
  if (!B) { el.hidden = true; el.innerHTML = ''; return; }
  const e = ENEMIES[B.id];
  const items = Object.keys(S.inv).filter(id => ITEMS[id].battle);
  const skillBtns = SKILLS.filter(s => S.lvl >= s.lvl).map(s => {
    const i = SKILLS.indexOf(s);
    const dis = B.over || S.st.energy < s.cost || (s.stun && B.stareCd > 0);
    return `<button class="act" data-s="${i}" ${dis ? 'disabled' : ''}><b>${s.name}</b><span>${s.tag} · ${s.cost ? s.cost + ' Energy' : 'free'}${s.stun ? ' · skips their turn' : ''}</span></button>`;
  }).join('');
  const itemBtns = items.map(id => `<button class="act" data-it="${id}" ${B.over ? 'disabled' : ''}><b>${ITEMS[id].name}${S.inv[id] > 1 ? ' ×' + S.inv[id] : ''}</b><span>${ITEMS[id].desc}</span></button>`).join('');
  const mood = Math.round(S.st.mood), en = Math.round(S.st.energy);
  el.innerHTML = `<div class="win battle" role="dialog" aria-modal="true" aria-labelledby="foe">
    <div class="win-h"><h2>Encounter</h2><span class="label mono">${fmt(S.t)}</span></div>
    <div class="win-b" style="gap:12px">
      <div class="foe">
        <div class="foe-name" id="foe">${esc(e.name)}</div>
        <p class="foe-desc">${esc(e.desc)}</p>
        <div class="stat-top"><span class="label">Their resolve</span><span class="mono">${B.hp} / ${B.max}</span></div>
        <div class="bar ${B.hit ? 'hit' : ''}"><i style="width:${B.hp / B.max * 100}%"></i></div>
      </div>
      <ul class="blog" aria-live="polite">${B.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
      <div class="me">
        <div class="stat"><div class="stat-top"><b>Your Mood</b><span class="mono">${mood}</span></div><div class="bar ${barClass('mood', mood)} ${B.meHit ? 'hit' : ''}"><i style="width:${mood}%"></i></div></div>
        <div class="stat"><div class="stat-top"><b>Your Energy</b><span class="mono">${en}</span></div><div class="bar ${barClass('energy', en)}"><i style="width:${en}%"></i></div></div>
      </div>
      ${B.over ? `<div class="battle-foot"><span class="hint">${B.over === 'win' ? 'You won.' : B.over === 'flee' ? 'You got away.' : 'You endured it.'}</span><button class="btn" id="bdone">Continue</button></div>` : `
      <div class="skillgrid">${B.showItems ? (itemBtns || '<p class="empty">Nothing in your bag helps here.</p>') : skillBtns}</div>
      <div class="battle-foot">
        <span class="hint">${hungry() ? 'You\'re hungry: you hit softer and take more. ' : ''}Each turn takes ${e.turn || 2} min.</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="btoggle">${B.showItems ? 'Skills' : `Bag (${items.length})`}</button>
          <button class="btn" id="bflee" ${e.noFlee ? 'disabled title="You can\'t leave. This is your job."' : ''}>${e.noFlee ? 'Can\'t leave' : 'Excuse yourself'}</button>
        </span>
      </div>`}
    </div></div>`;
  el.hidden = false;
  B.hit = false; B.meHit = false;
  el.querySelectorAll('[data-s]').forEach(b => b.onclick = () => useSkill(+b.dataset.s));
  el.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { B.showItems = false; useItem(b.dataset.it); });
  if ($('btoggle')) $('btoggle').onclick = () => { B.showItems = !B.showItems; render(); };
  if ($('bflee')) $('bflee').onclick = flee;
  if ($('bdone')) { $('bdone').onclick = endBattle; $('bdone').focus(); }
}

/* ---------- Boot ---------- */
function start(data) {
  const saved = (data && data.S) || loadSave();
  if (saved && saved.started && !saved.over) {
    const base = fresh();
    S = Object.assign(base, saved, { f: Object.assign(base.f, saved.f), q: Object.assign(base.q, saved.q) });
    render();
    if (data && data.S) return;
    showTitle(true);
  } else {
    render();
    showTitle(false);
  }
}
window.claude?.hot?.snapshot?.(() => (B || modalOpen || Q.length) ? {} : { S });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
